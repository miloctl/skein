# Keeps the SHA-pinned actions in .github/workflows current. Dependabot
# updates the pinned digest and the trailing "# vN" comment together, so the
# immutable-pin rule in backend/tests/test_release_contract.py holds across
# a bump. One grouped PR a week, not one per action.
#
# npm covers both roots in ONE grouped PR: backend/tests/test_release_contract.py
# requires the workplace template to pin the same next, react and react-dom as
# the frontend host, so a bump of one root alone fails CI. The template lock
# also pins the packed host tarball by digest; CI re-pins a copy of that lock
# for its own contract run, and prepare-release.py re-pins the tracked one, so
# a merged npm PR needs no hand re-pin before a release.
#
# pip stays manual: the Python locks are pip-compile output under a custom
# name (requirements.lock, hashes included), which Dependabot does not read.
# CI installs the backend unpinned behind a seven-day cooldown (uv
# --exclude-newer in ci.yml), so a new Python release is still tested on
# every push once it has been public a week - FastAPI 0.142.1 broke boot the
# day it was published - and audit-deps.sh fails the push on an advisory
# against the lock. The same seven days gate every bot below: a release
# pulled or patched within its first week never reaches a PR. Renovate (renovate.json) takes pip over when the Gitea instance
# enables it (TODO.md); it leaves .github/workflows and these npm roots alone,
# so the two never open competing PRs.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns: ["*"]
    commit-message:
      prefix: chore
  - package-ecosystem: npm
    directories:
      - /frontend
      - /examples/workplace-extension
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    groups:
      npm:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      # the host tarball and the frozen extension API are release outputs
      - dependency-name: "@miloctl/*"
    commit-message:
      prefix: chore
