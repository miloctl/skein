name: finalize-release

on:
  workflow_dispatch:
    inputs:
      release_run_id:
        description: Original successful release workflow run ID
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: finalize-release
  cancel-in-progress: false

jobs:
  verify:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      release_sha: ${{ steps.release.outputs.release_sha }}
      version: ${{ steps.packages.outputs.version }}
      tag: ${{ steps.packages.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          registry-url: https://registry.npmjs.org
      - name: Validate the original release run
        id: release
        env:
          RELEASE_RUN_ID: ${{ inputs.release_run_id }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/validate_release_run.py
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ steps.release.outputs.artifact_id }}
          path: artifact
          run-id: ${{ steps.release.outputs.artifact_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          # artifact-ids uses the multi-artifact extraction layout. Flatten
          # the single selected artifact so verify_release_packages.py sees
          # the three files directly under artifact/ (it uses iterdir, never a
          # recursive walk). Same contract as publish-release.yml.
          merge-multiple: true
      - name: Inspect the tested packages
        id: packages
        run: python scripts/verify_release_packages.py inspect artifact
      - name: Pull and compare registry packages
        env:
          NPM_CONFIG_CACHE: ${{ runner.temp }}/finalize-npm-cache
          VERSION: ${{ steps.packages.outputs.version }}
          EXTENSION_VERSION: ${{ steps.packages.outputs.extension_version }}
        run: |
          set -euo pipefail
          success=""
          for attempt in 1 2 3 4 5; do
            rm -rf registry
            mkdir registry
            if python -m pip download --no-deps --only-binary=:all: --no-cache-dir \
                --dest registry "skein-agents==$VERSION" \
                --index-url https://pypi.org/simple \
                && npm pack "@miloctl/skein-extension-api@$EXTENSION_VERSION" \
                  --pack-destination registry --registry https://registry.npmjs.org >/dev/null \
                && npm pack "@miloctl/skein-frontend-host@$VERSION" \
                  --pack-destination registry --registry https://registry.npmjs.org >/dev/null; then
              success=1
              break
            fi
            if [ "$attempt" -lt 5 ]; then
              sleep $((attempt * 10))
            fi
          done
          [ -n "$success" ] || {
            echo "finalize-release: registry pull-back did not complete." >&2
            exit 1
          }
          python scripts/verify_release_packages.py compare artifact registry

  tag:
    needs: verify
    runs-on: ubuntu-latest
    environment: release-finalization
    # GITHUB_TOKEN is a GitHub App token. Even with contents: write, GitHub
    # refuses a tag whose commit changes .github/workflows/* unless that App
    # has the separate Workflows permission — which workflow permissions:
    # cannot grant. The protected environment supplies a narrowly-held PAT
    # instead; the automatic token needs read access only.
    permissions:
      contents: read
    steps:
      - name: Check the release tag credential
        env:
          RELEASE_TAG_TOKEN: ${{ secrets.RELEASE_TAG_TOKEN }}
        run: |
          [ -n "$RELEASE_TAG_TOKEN" ] || {
            echo "finalize-release: RELEASE_TAG_TOKEN is not configured on the release-finalization environment." >&2
            echo "Create a token with repository Contents write and Workflows write, then rerun this workflow." >&2
            exit 1
          }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify.outputs.release_sha }}
          fetch-depth: 0
          # Persisted for the one `git push refs/tags/...` below. The secret is
          # scoped to the protected release-finalization environment, so no
          # gate or registry job receives it.
          token: ${{ secrets.RELEASE_TAG_TOKEN }}
      - name: Create the immutable annotated tag
        env:
          RELEASE_SHA: ${{ needs.verify.outputs.release_sha }}
          VERSION: ${{ needs.verify.outputs.version }}
          TAG: ${{ needs.verify.outputs.tag }}
        run: |
          set -euo pipefail
          [ "$(git rev-parse HEAD)" = "$RELEASE_SHA" ]
          verify_tag() {
            [ "$(git cat-file -t "refs/tags/$TAG")" = "tag" ] || {
              echo "finalize-release: the existing tag is not annotated." >&2
              return 1
            }
            [ "$(git rev-list -n 1 "refs/tags/$TAG")" = "$RELEASE_SHA" ] || {
              echo "finalize-release: the existing tag points to another commit." >&2
              return 1
            }
          }
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            git fetch origin "refs/tags/$TAG:refs/tags/$TAG"
            verify_tag
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" "$RELEASE_SHA" -m "Skein $VERSION"
          if git push origin "refs/tags/$TAG"; then
            exit 0
          fi
          git tag -d "$TAG"
          # A concurrent finalizer may have won the race after the first
          # ls-remote. Accept only its identical annotated tag. If no remote
          # tag exists, keep the original push failure as the diagnosis — an
          # unconditional fetch used to add a misleading "couldn't find remote
          # ref" after a credential refusal.
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            git fetch origin "refs/tags/$TAG:refs/tags/$TAG"
            verify_tag
            exit 0
          fi
          echo "finalize-release: tag push failed and no remote tag exists." >&2
          exit 1
