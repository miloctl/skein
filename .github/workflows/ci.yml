# GitHub-hosted runners are disposable, so this workflow verifies pull
# requests before merge. It NEVER publishes: a green run on main stores the
# exact artifact every gate consumed, and .github/workflows/publish-release.yml
# publishes those bytes when a human names this run.
name: ci
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

# One run per ref. A superseded pull-request run is cancelled: its commit is
# gone and its minutes are paid. A RUNNING main run is never cancelled: a
# green main run stores the artifact publish-release.yml names, and cancelling
# it would drop the one artifact a release can still be completed from. A
# PENDING main run is not protected: GitHub keeps one pending run per group
# and cancels it when a newer push queues. Name the newer run instead - the
# release marker stays on every later commit until the next release changes it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # 60 is a hang ceiling, not a budget: GitHub's default is 360, and a job
  # stuck on a dead database or a hung transport would hold a runner for six
  # hours. Read the Actions history before lowering it toward a real duration.
  packages:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.11.11"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Build release packages
        run: |
          uv build --wheel --out-dir dist backend
          npm pack --silent --pack-destination dist ./frontend/packages/extension-api >/dev/null
          npm pack --silent --pack-destination dist ./frontend >/dev/null
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-packages
          path: |
            dist/*.whl
            dist/*.tgz
          if-no-files-found: error
          # explicit, not the org default: this artifact is the only thing
          # publish-release.yml may publish, so its lifetime is the window in
          # which a release can still be completed. An org retention limit
          # below 90 still clamps it (with a log warning), and
          # validate_release_run.py refuses an expired artifact.
          retention-days: 90

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      # Same major as docker-compose.yml and the Dockerfile's pg_dump. The
      # suite needs a real server: conftest exits (code 35) when it cannot
      # reach one.
      postgres:
        image: postgres:17-alpine@sha256:d4bb0a8c1b7bb2e29f976d099e7bfb9a5d8858cffe9e46b35cd302cd1f1f8168
        env:
          POSTGRES_USER: skein
          POSTGRES_PASSWORD: skein
          POSTGRES_DB: skein
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U skein -d skein"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # tags and full history: scripts/upgrade-path.sh diffs the schema
          # against the newest v* tag, and a shallow clone cannot reach it
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.11.11"
      - name: Install
        working-directory: backend
        # a seven-day cooldown, unpinned past it: a release pulled or patched in
        # its first week never reaches a test run (FastAPI 0.142.1 broke boot the
        # day it was published), and a week-old one is still tested on every
        # push. test_release_contract.py pins the flag on all three installs.
        run: uv pip install --system -e ".[dev]" --exclude-newer "$(date -u -d '7 days ago' +%F)"
      # BEFORE the tests, and major 17 exactly: the backup suite drills
      # pg_dump/pg_restore against the postgres:17 service, and the runner's
      # preinstalled 16 client refuses a 17 server.
      - name: PostgreSQL 17 client
        run: |
          if ! pg_dump --version 2>/dev/null | grep -q ' 17\.'; then
            sudo install -d /usr/share/postgresql-common/pgdg
            curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc \
              | sudo tee /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc >/dev/null
            echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] http://apt.postgresql.org/pub/repos/apt $(. /etc/os-release && echo $VERSION_CODENAME)-pgdg main" \
              | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
            sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client-17
          fi
      - name: Lint
        run: ./scripts/lint.sh backend
      - name: Test
        working-directory: backend
        env:
          SKEIN_MODEL_PROVIDER: mock
          SKEIN_SCHEDULER: "0"
          SKEIN_DATABASE_URL: postgresql://skein:skein@localhost:5432/skein
        # the coverage ratchet: 90 against a measured 91. Raise it when the
        # number rises, never lower it to make a commit pass.
        run: pytest -q -n auto --cov=app --cov-fail-under=90
      - name: Restricted database role contract
        working-directory: backend
        env:
          SKEIN_DATABASE_URL: postgresql://skein:skein@localhost:5432/skein
          SKEIN_ROLE_CONTRACT: "1"
        run: pytest -q -n0 tests/test_database_role.py
      - name: Audit production dependencies
        run: ./scripts/audit-deps.sh backend
      - name: Upgrade path
        env:
          SKEIN_DATABASE_URL: postgresql://skein:skein@localhost:5432/skein
        run: ./scripts/upgrade-path.sh

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        working-directory: frontend
        run: npm ci
      - name: Lint
        env:
          # `next build` below typechecks the same files; lint.sh documents this flag.
          SKIP_TSC: "1"
        run: ./scripts/lint.sh frontend
      - name: Test
        working-directory: frontend
        # the floor lives in vitest.config.mts, beside the number it defends
        run: npm run test:coverage
      - name: Audit production dependencies
        run: ./scripts/audit-deps.sh frontend
      - name: Build
        working-directory: frontend
        run: npm run build

  extension-contracts:
    # The job this workflow exists for. Unit tests cannot detect missing
    # wheel data, package-host drift, or a broken Kustomize overlay, and on
    # Gitea these four scripts run only after a change has already merged.
    needs: [packages]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:17-alpine@sha256:d4bb0a8c1b7bb2e29f976d099e7bfb9a5d8858cffe9e46b35cd302cd1f1f8168
        env:
          POSTGRES_USER: skein
          POSTGRES_PASSWORD: skein
          POSTGRES_DB: skein
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U skein -d skein"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      SKEIN_CONTRACT_RUN_ID: ci
      SKEIN_RELEASE_DIST: ${{ github.workspace }}/dist
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-packages
          path: dist
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.11.11"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            examples/workplace-extension/package-lock.json
      - uses: azure/setup-kubectl@bda439f5f36b99b262ebdcd3613869bddb064c8e # v5.2.0
      - name: Install
        run: |
          python -m venv backend/.venv
          uv pip install --python backend/.venv/bin/python -e "backend[dev]" --exclude-newer "$(date -u -d '7 days ago' +%F)"
          npm --prefix frontend ci
      - name: Cache the extension-contract Chromium download
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: extension-playwright
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}
      - name: Install extension-contract Chromium
        working-directory: frontend
        run: |
          if [ "${{ steps.extension-playwright.outputs.cache-hit }}" = "true" ]; then
            npx playwright install-deps chromium
          else
            npx playwright install --with-deps chromium
          fi
      - name: Backend package contract
        env:
          SKEIN_DATABASE_URL: postgresql://skein:skein@localhost:5432/skein
        run: ./scripts/reference-extension-contract.sh
      - name: Frontend package contract
        env:
          SKEIN_DATABASE_URL: postgresql://skein:skein@localhost:5432/skein
        run: ./scripts/reference-frontend-contract.sh
      - name: Deployment contract
        run: ./scripts/reference-deployment-contract.sh
      - name: Derivative image contract
        run: ./scripts/reference-images-contract.sh
      - name: Audit workplace production dependencies
        run: ./scripts/audit-deps.sh workplace
      - name: Keep browser failure traces
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-failures-${{ github.job }}
          path: frontend/test-results/
          retention-days: 7
          if-no-files-found: ignore

  e2e:
    # a real browser walking the real app against a seeded mock-provider
    # backend, then the oidc sign-in against a stub IdP. Needs both
    # toolchains, so it is its own job.
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      # The walked backend is the real one, so it needs the real database.
      # Both playwright configs seed into it.
      postgres:
        image: postgres:17-alpine@sha256:d4bb0a8c1b7bb2e29f976d099e7bfb9a5d8858cffe9e46b35cd302cd1f1f8168
        env:
          POSTGRES_USER: skein
          POSTGRES_PASSWORD: skein
          POSTGRES_DB: skein
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U skein -d skein"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.11.11"
      - name: Install backend
        working-directory: backend
        # the e2e configs boot uvicorn from .venv, same path as local runs.
        # Runtime deps only, as in the Gitea copy: the oidc walk's stub IdP
        # signs with pyjwt[crypto], a runtime dependency (backend/pyproject.toml).
        run: python -m venv .venv && uv pip install --python .venv/bin/python -e . --exclude-newer "$(date -u -d '7 days ago' +%F)"
      - name: Cache the Chromium download
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: playwright
        with:
          path: ~/.cache/ms-playwright
          # Playwright pins a browser build per release, so the lockfile is
          # the whole key: a @playwright/test bump must miss this cache.
          key: playwright-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}
      - name: Install frontend
        working-directory: frontend
        # install-deps is the apt half and is NOT in the cached path, so it
        # runs on a hit too. Only the browser download is skipped.
        run: |
          npm ci
          if [ "${{ steps.playwright.outputs.cache-hit }}" = "true" ]; then
            npx playwright install-deps chromium
          else
            npx playwright install --with-deps chromium
          fi
      - name: Smoke
        working-directory: frontend
        run: npx playwright test
      - name: Sign-in smoke (oidc)
        working-directory: frontend
        # oidc is the production auth mode, and the suite above walks
        # trusted-header. Its own config because NEXT_PUBLIC_API_URL is baked
        # at build time, so it needs a second backend and a second build.
        run: npx playwright test --config playwright.oidc.config.ts
      - name: Keep browser failure traces
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-failures-${{ github.job }}
          path: frontend/test-results/
          retention-days: 7
          if-no-files-found: ignore
