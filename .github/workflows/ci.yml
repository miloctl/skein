# GitHub-hosted runners are disposable, so this workflow verifies pull
# requests before merge. A reviewed change to .github/release-version on
# protected main publishes only the exact artifacts that every gate consumed.
#
# Tags do not trigger publication. Each publication job holds only its own
# registry permission after every gate passes.
name: ci
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  packages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.11.11"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Build release packages
        run: |
          uv build --wheel --out-dir dist backend
          npm pack --silent --pack-destination dist ./frontend/packages/extension-api >/dev/null
          npm pack --silent --pack-destination dist ./frontend >/dev/null
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-packages
          path: |
            dist/*.whl
            dist/*.tgz
          if-no-files-found: error

  backend:
    runs-on: ubuntu-latest
    services:
      # Same major as docker-compose.yml and the Dockerfile's pg_dump. The
      # suite builds a template database and clones it per test, which needs a
      # real server — there is no in-process substitute the way SQLite was.
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: skein
          POSTGRES_PASSWORD: skein
          POSTGRES_DB: skein
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U skein -d skein"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # tags and full history: scripts/upgrade-path.sh diffs the schema
          # against the newest v* tag, and a shallow clone cannot reach it
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.11.11"
      - name: Install
        working-directory: backend
        run: pip install -e ".[dev]"
      # BEFORE the tests, and major 17 exactly: the backup suite drills
      # pg_dump/pg_restore against the postgres:17 service, and the runner's
      # preinstalled 16 client refuses a 17 server.
      - name: PostgreSQL 17 client
        run: |
          if ! pg_dump --version 2>/dev/null | grep -q ' 17\.'; then
            sudo install -d /usr/share/postgresql-common/pgdg
            curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc \
              | sudo tee /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc >/dev/null
            echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] http://apt.postgresql.org/pub/repos/apt $(. /etc/os-release && echo $VERSION_CODENAME)-pgdg main" \
              | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
            sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client-17
          fi
      - name: Lint
        run: ./scripts/lint.sh backend
      - name: Test
        working-directory: backend
        env:
          SKEIN_MODEL_PROVIDER: mock
          SKEIN_SCHEDULER: "0"
          SKEIN_DATABASE_URL: postgresql://skein:skein@localhost:5432/skein
        # the coverage ratchet: 90 against a measured 91. Raise it when the
        # number rises, never lower it to make a commit pass.
        run: pytest -q -n auto --cov=app --cov-fail-under=90
      - name: Restricted database role contract
        working-directory: backend
        env:
          SKEIN_DATABASE_URL: postgresql://skein:skein@localhost:5432/skein
          SKEIN_ROLE_CONTRACT: "1"
        run: pytest -q -n0 tests/test_database_role.py
      - name: Audit production dependencies
        run: ./scripts/audit-deps.sh backend
      - name: Upgrade path
        env:
          SKEIN_DATABASE_URL: postgresql://skein:skein@localhost:5432/skein
        run: ./scripts/upgrade-path.sh

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        working-directory: frontend
        run: npm ci
      - name: Lint
        env:
          # `next build` below typechecks the same files; lint.sh documents this flag.
          SKIP_TSC: "1"
        run: ./scripts/lint.sh frontend
      - name: Test
        working-directory: frontend
        # the floor lives in vitest.config.mts, beside the number it defends
        run: npm run test:coverage
      - name: Audit production dependencies
        run: ./scripts/audit-deps.sh frontend
      - name: Build
        working-directory: frontend
        run: npm run build

  extension-contracts:
    # The job this workflow exists for. Unit tests cannot detect missing
    # wheel data, package-host drift, or a broken Kustomize overlay, and on
    # Gitea these four scripts run only after a change has already merged.
    needs: [packages]
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: skein
          POSTGRES_PASSWORD: skein
          POSTGRES_DB: skein
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U skein -d skein"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      # reference-extension-contract.sh and upgrade-path.sh each build several
      # isolated app instances, and an instance is a DATABASE now.
      SKEIN_DATABASE_URL: postgresql://skein:skein@localhost:5432/skein
      SKEIN_CONTRACT_RUN_ID: ci
      SKEIN_RELEASE_DIST: ${{ github.workspace }}/dist
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-packages
          path: dist
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.11.11"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            examples/workplace-extension/package-lock.json
      - uses: azure/setup-kubectl@776406bce94f63e41d621b960d78ee25c8b76ede # v4
      - name: Install
        run: |
          python -m venv backend/.venv
          backend/.venv/bin/pip install -e "backend[dev]"
          npm --prefix frontend ci
      - name: Backend package contract
        run: ./scripts/reference-extension-contract.sh
      - name: Frontend package contract
        run: ./scripts/reference-frontend-contract.sh
      - name: Deployment contract
        run: ./scripts/reference-deployment-contract.sh
      - name: Derivative image contract
        run: ./scripts/reference-images-contract.sh
      - name: Audit workplace production dependencies
        run: ./scripts/audit-deps.sh workplace

  e2e:
    # a real browser walking the real app against a seeded mock-provider
    # backend, then the oidc sign-in against a stub IdP. Needs both
    # toolchains, so it is its own job.
    runs-on: ubuntu-latest
    services:
      # The walked backend is the real one, so it needs the real database.
      # Both playwright configs seed into it.
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: skein
          POSTGRES_PASSWORD: skein
          POSTGRES_DB: skein
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U skein -d skein"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      SKEIN_DATABASE_URL: postgresql://skein:skein@localhost:5432/skein
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend
        working-directory: backend
        # the e2e configs boot uvicorn from .venv, same path as local runs.
        # [dev] here and not in the Gitea copy: the oidc walk's stub IdP
        # signs with pyjwt[crypto], which the runtime deps already carry.
        run: python -m venv .venv && .venv/bin/pip install -e .
      - name: Cache the Chromium download
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        id: playwright
        with:
          path: ~/.cache/ms-playwright
          # Playwright pins a browser build per release, so the lockfile is
          # the whole key: a @playwright/test bump must miss this cache.
          key: playwright-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}
      - name: Install frontend
        working-directory: frontend
        # install-deps is the apt half and is NOT in the cached path, so it
        # runs on a hit too. Only the browser download is skipped.
        run: |
          npm ci
          if [ "${{ steps.playwright.outputs.cache-hit }}" = "true" ]; then
            npx playwright install-deps chromium
          else
            npx playwright install --with-deps chromium
          fi
      - name: Smoke
        working-directory: frontend
        run: npx playwright test
      - name: Sign-in smoke (oidc)
        working-directory: frontend
        # oidc is the production auth mode, and the suite above walks
        # trusted-header. Its own config because NEXT_PUBLIC_API_URL is baked
        # at build time, so it needs a second backend and a second build.
        run: npx playwright test --config playwright.oidc.config.ts

  release-guard:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [packages, backend, frontend, extension-contracts, e2e]
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.release.outputs.publish }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Check release marker
        id: release
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          version="$(tr -d '[:space:]' <.github/release-version)"
          if [ "$version" = "unreleased" ]; then
            echo "publish=false" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          zero="0000000000000000000000000000000000000000"
          if [ "$BEFORE_SHA" != "$zero" ] \
              && git diff --quiet "$BEFORE_SHA" "$GITHUB_SHA" -- .github/release-version; then
            echo "publish=false" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "release-guard: release-version must be unreleased or X.Y.Z." >&2
            exit 1
          fi
          declared="$(sed -n 's/^version = "\(.*\)"/\1/p' backend/pyproject.toml | head -1)"
          if [ "$version" != "$declared" ]; then
            echo "release-guard: release-version does not match the declared version." >&2
            exit 1
          fi
          echo "publish=true" >>"$GITHUB_OUTPUT"
          echo "version=$version" >>"$GITHUB_OUTPUT"

  publish-pypi:
    if: needs.release-guard.outputs.publish == 'true'
    needs: [packages, backend, frontend, extension-contracts, e2e, release-guard]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-packages
          path: dist
      - name: Select the tested wheel
        run: |
          mkdir pypi-dist
          cp dist/*.whl pypi-dist/
          [ "$(find pypi-dist -maxdepth 1 -type f -name '*.whl' | wc -l)" -eq 1 ]
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.11.11"
      - name: Publish skein-agents to PyPI
        run: uv publish --trusted-publishing always pypi-dist/*.whl

  publish-npm:
    if: needs.release-guard.outputs.publish == 'true'
    needs: [packages, backend, frontend, extension-contracts, e2e, release-guard]
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      packages: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-packages
          path: dist
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          registry-url: https://npm.pkg.github.com
          scope: "@miloctl"
      - name: Publish the npm packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          url="https://npm.pkg.github.com"
          manifest_field() {
            tar -xOzf "$1" package/package.json \
              | node -e 'let s=""; process.stdin.on("data",c=>s+=c).on("end",()=>process.stdout.write(String(JSON.parse(s)[process.argv[1]])))' "$2"
          }
          lookup_integrity() {
            local name="$1" version="$2" output="$3" errors="$4" attempt
            for attempt in 1 2 3; do
              if npm view "$name@$version" dist.integrity --registry "$url" >"$output" 2>"$errors"; then
                return 0
              fi
              if grep -Eq 'E404|404 Not Found' "$errors"; then
                return 4
              fi
              if [ "$attempt" -lt 3 ]; then
                sleep $((attempt * 5))
              fi
            done
            while IFS= read -r line; do echo "$line" >&2; done <"$errors"
            return 1
          }
          publish_package() {
            local archive="$1" name version remote_integrity local_integrity output errors status
            name="$(manifest_field "$archive" name)"
            version="$(manifest_field "$archive" version)"
            output="$RUNNER_TEMP/npm-view-$(basename "$archive").out"
            errors="$RUNNER_TEMP/npm-view-$(basename "$archive").err"
            if lookup_integrity "$name" "$version" "$output" "$errors"; then
              remote_integrity="$(<"$output")"
              local_integrity="sha512-$(node -e "const fs=require('node:fs'),crypto=require('node:crypto'); process.stdout.write(crypto.createHash('sha512').update(fs.readFileSync(process.argv[1])).digest('base64'))" "$archive")"
              if [ "$remote_integrity" != "$local_integrity" ]; then
                echo "$name@$version exists with different package bytes" >&2
                exit 1
              fi
              echo "$name@$version already has the tested package bytes."
              return
            else
              status=$?
            fi
            if [ "$status" -ne 4 ]; then
              exit "$status"
            fi
            npm publish "$archive" --registry "$url"
          }
          publish_package dist/miloctl-skein-extension-api-*.tgz
          publish_package dist/miloctl-skein-frontend-host-*.tgz
