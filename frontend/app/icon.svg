<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Plate, not a transparent glyph. A favicon sits on browser chrome we do
       not control: no single ink clears 4.5:1 against both a white tab strip
       and a #202124 dark one (thread light manages 7.0 and 1.7, thread dark
       2.0 and 8.1). An opaque plate moves the contrast inside the icon, where
       it is 8.9:1 and fixed. Same reason Linear and Notion ship plates. -->
  <rect width="32" height="32" rx="6" fill="#3b4dbf"/>
  <path d="M5 7 L16 15 L27 7 L27 17 L16 25 L5 17 Z" fill="#faf9f6"/>
</svg>
