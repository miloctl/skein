apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - deployment/skein.yaml
patches:
  - path: deployment/workplace-patch.yaml
  - path: deployment/workplace-frontend-patch.yaml
configMapGenerator:
  - name: atlas-skein-content
    files:
      - content/playbooks/atlas_delivery.yaml
generatorOptions:
  disableNameSuffixHash: false
