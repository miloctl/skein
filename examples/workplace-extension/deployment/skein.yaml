apiVersion: apps/v1
kind: Deployment
metadata:
  name: skein
spec:
  replicas: 1
  strategy:
    type: Recreate
  progressDeadlineSeconds: 1800
  selector:
    matchLabels:
      app: skein
  template:
    metadata:
      labels:
        app: skein
    spec:
      terminationGracePeriodSeconds: 210
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: skein
          image: skein:0.3.2
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: SKEIN_DB_HOST
              valueFrom:
                configMapKeyRef:
                  name: skein-config
                  key: SKEIN_DB_HOST
            - name: SKEIN_DB_PORT
              valueFrom:
                configMapKeyRef:
                  name: skein-config
                  key: SKEIN_DB_PORT
            - name: SKEIN_DB_USER
              valueFrom:
                secretKeyRef:
                  name: skein-db-secret
                  key: SKEIN_APP_USER
            - name: SKEIN_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: skein-db-secret
                  key: SKEIN_APP_PASSWORD
            - name: SKEIN_DB_NAME
              valueFrom:
                secretKeyRef:
                  name: skein-db-secret
                  key: POSTGRES_DB
          envFrom:
            - configMapRef:
                name: skein-config
            - secretRef:
                name: skein-secrets
                optional: true
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            failureThreshold: 150
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: skein-data
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: skein-data
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: skein-api
spec:
  selector:
    app: skein
  ports:
    - name: http
      port: 8000
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: skein-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: skein-frontend
  template:
    metadata:
      labels:
        app: skein-frontend
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: frontend
          image: skein-frontend:0.3.2
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          ports:
            - name: http
              containerPort: 3000
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: skein-frontend
spec:
  selector:
    app: skein-frontend
  ports:
    - name: http
      port: 3000
      targetPort: http
