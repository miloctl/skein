apiVersion: apps/v1
kind: Deployment
metadata:
  name: skein
spec:
  replicas: 1
  selector:
    matchLabels:
      app: skein
  template:
    metadata:
      labels:
        app: skein
    spec:
      securityContext:
        runAsNonRoot: true
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: skein
          image: skein:0.2.1
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          ports:
            - name: http
              containerPort: 8000
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: skein-data
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: skein-data
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: atlas-skein-data
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: skein-api
spec:
  selector:
    app: skein
  ports:
    - name: http
      port: 8000
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: skein-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: skein-frontend
  template:
    metadata:
      labels:
        app: skein-frontend
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
        - name: frontend
          image: skein-frontend:0.2.1
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          ports:
            - name: http
              containerPort: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: skein-frontend
spec:
  selector:
    app: skein-frontend
  ports:
    - name: http
      port: 3000
      targetPort: http
