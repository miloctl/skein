[project]
name = "atlas-skein-extension"
version = "2.0.0"
description = "Fictional workplace extension for the Skein extension contract"
requires-python = ">=3.12"
dependencies = [
    "skein-agents>=0.3.0,<0.4.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8",
    "httpx2>=2.9",
]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["backend/src"]
