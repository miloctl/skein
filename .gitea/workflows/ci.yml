# push-only by design: a runner that shares a host with a live deployment
# must never execute untrusted pull_request code. Add a PR trigger only on an
# ephemeral, sandboxed runner host.
#
# Manual clone instead of actions/checkout: some Gitea instances 403 the
# `x-access-token` basic-auth username the action hardcodes; a real username
# and token work. Set two repo secrets: CI_CHECKOUT_USER, CI_CHECKOUT_TOKEN.
name: ci
on:
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        run: |
          base="${{ github.server_url }}"
          git clone --depth 50 "${base%%://*}://${{ secrets.CI_CHECKOUT_USER }}:${{ secrets.CI_CHECKOUT_TOKEN }}@${base#*://}/${{ github.repository }}.git" .
          git checkout "$GITHUB_SHA"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        working-directory: backend
        run: pip install -e ".[dev]"
      - name: Lint
        working-directory: backend
        run: |
          ruff check app tests seed.py ../cli/skein_cli.py ../scripts
          ruff format --check app tests seed.py ../cli/skein_cli.py ../scripts
          mypy
          vulture
          python -m app.services.personas
          python ../scripts/check_theme_contrast.py
          cmp ../LICENSE LICENSE && cmp ../NOTICE NOTICE
      - name: Test
        working-directory: backend
        env:
          SKEIN_MODEL_PROVIDER: mock
          SKEIN_SCHEDULER: "0"
        run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        run: |
          base="${{ github.server_url }}"
          git clone --depth 50 "${base%%://*}://${{ secrets.CI_CHECKOUT_USER }}:${{ secrets.CI_CHECKOUT_TOKEN }}@${base#*://}/${{ github.repository }}.git" .
          git checkout "$GITHUB_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install
        working-directory: frontend
        run: npm ci
      - name: Lint
        working-directory: frontend
        run: |
          npm run lint
          npm run knip
      - name: Build
        working-directory: frontend
        run: npm run build
