# push-only by design: a runner that shares a host with a live deployment
# must never execute untrusted pull_request code. Add a PR trigger only on an
# ephemeral, sandboxed runner host.
#
# Manual clone instead of actions/checkout: some Gitea instances 403 the
# `x-access-token` basic-auth username the action hardcodes; a real username
# and token work. Set two repo secrets: CI_CHECKOUT_USER, CI_CHECKOUT_TOKEN.
#
# Lint gates live in scripts/lint.sh alone — call it, never restate a gate
# here, or the local run and CI drift apart again.
name: ci
on:
  push:
    branches: [main]
    # A v* tag runs the publish job below AND every job it needs: — the gates
    # do not guard themselves off, because a tag that published a wheel no
    # test ran against is the failure the needs: exists to prevent. So every
    # gate must pass at the tagged commit, scripts/upgrade-path.sh included:
    # its baseline is the newest OTHER tag, which at a release commit is the
    # release before it.
    tags: ["v*"]

jobs:
  packages:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        run: |
          base="${{ github.server_url }}"
          git clone --depth 50 "${base%%://*}://${{ secrets.CI_CHECKOUT_USER }}:${{ secrets.CI_CHECKOUT_TOKEN }}@${base#*://}/${{ github.repository }}.git" .
          git checkout "$GITHUB_SHA"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build release packages
        run: |
          uv build --wheel --out-dir dist backend
          npm pack --silent --pack-destination dist ./frontend/packages/extension-api >/dev/null
          npm pack --silent --pack-destination dist ./frontend >/dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: release-packages
          path: |
            dist/*.whl
            dist/*.tgz
          if-no-files-found: error

  backend:
    runs-on: ubuntu-latest
    services:
      # Same major as docker-compose.yml and the Dockerfile's pg_dump. The
      # suite has no in-process substitute the way SQLite was — conftest exits
      # without a reachable server.
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: skein
          POSTGRES_PASSWORD: skein
          POSTGRES_DB: skein
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U skein -d skein"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - name: Checkout
        run: |
          base="${{ github.server_url }}"
          git clone --depth 50 "${base%%://*}://${{ secrets.CI_CHECKOUT_USER }}:${{ secrets.CI_CHECKOUT_TOKEN }}@${base#*://}/${{ github.repository }}.git" .
          git checkout "$GITHUB_SHA"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install
        working-directory: backend
        run: pip install -e ".[dev]"
      # BEFORE the tests, and major 17 exactly: the backup suite drills
      # pg_dump/pg_restore against the postgres:17 service, the runner image
      # ships no client, and a 16 client refuses a 17 server.
      - name: PostgreSQL 17 client
        run: |
          if ! pg_dump --version 2>/dev/null | grep -q ' 17\.'; then
            apt-get update -qq && apt-get install -y -qq curl ca-certificates
            install -d /usr/share/postgresql-common/pgdg
            curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc \
              -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc
            echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] http://apt.postgresql.org/pub/repos/apt $(. /etc/os-release && echo $VERSION_CODENAME)-pgdg main" \
              > /etc/apt/sources.list.d/pgdg.list
            apt-get update -qq && apt-get install -y -qq postgresql-client-17
          fi
      - name: Lint
        run: ./scripts/lint.sh backend
      - name: Test
        working-directory: backend
        env:
          SKEIN_MODEL_PROVIDER: mock
          SKEIN_SCHEDULER: "0"
          SKEIN_DATABASE_URL: postgresql://skein:skein@localhost:5432/skein
        # The coverage gate lives here, not in addopts: coverage adds ~45%
        # to a run, so local `pytest` stays fast and this step holds the
        # floor. 90 is a ratchet — measured 91% on 2026-08-14; raise it when
        # the number rises, never lower it to make a commit pass.
        run: pytest -q -n auto --cov=app --cov-fail-under=90
      - name: Restricted database role contract
        working-directory: backend
        env:
          SKEIN_DATABASE_URL: postgresql://skein:skein@localhost:5432/skein
          SKEIN_ROLE_CONTRACT: "1"
        # Separate and serial: this test switches the process pool from the
        # bootstrap superuser to a disposable NOSUPERUSER role.
        run: pytest -q -n0 tests/test_database_role.py
      - uses: astral-sh/setup-uv@v6
      - name: Audit production dependencies
        # scripts/audit-deps.sh explains why this resolves the production
        # set instead of auditing the installed dev environment.
        run: ./scripts/audit-deps.sh backend
      - name: Upgrade path
        # the clone above is shallow and tagless; the baseline tag's commit
        # must be reachable for the worktree. Skips itself until the first
        # v* release tag exists. The psql guard is for the self-hosted
        # runner image, which ships no PostgreSQL client — the script
        # creates its databases with psql.
        env:
          SKEIN_DATABASE_URL: postgresql://skein:skein@localhost:5432/skein
        run: |
          if ! command -v psql >/dev/null; then apt-get update -qq && apt-get install -y -qq postgresql-client; fi
          git fetch --tags --unshallow --quiet || git fetch --tags --quiet
          ./scripts/upgrade-path.sh

  frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        run: |
          base="${{ github.server_url }}"
          git clone --depth 50 "${base%%://*}://${{ secrets.CI_CHECKOUT_USER }}:${{ secrets.CI_CHECKOUT_TOKEN }}@${base#*://}/${{ github.repository }}.git" .
          git checkout "$GITHUB_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        working-directory: frontend
        run: npm ci
      - name: Lint
        env:
          # `next build` below typechecks the same files; lint.sh documents this flag.
          SKIP_TSC: "1"
        run: ./scripts/lint.sh frontend
      - name: Test
        working-directory: frontend
        # The floor lives in vitest.config.mts, beside the number it defends.
        run: npm run test:coverage
      - name: Audit production dependencies
        # the --omit=dev reasoning moved into the script, beside the
        # backend half that now makes the same call
        run: ./scripts/audit-deps.sh frontend
      - name: Build
        working-directory: frontend
        run: npm run build

  extension-contracts:
    # Exercise the installed artifacts and derivative deployment. Unit tests
    # alone cannot detect missing wheel data, package-host drift, or a broken
    # Kustomize overlay.
    needs: [packages]
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: skein
          POSTGRES_PASSWORD: skein
          POSTGRES_DB: skein
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U skein -d skein"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      # reference-extension-contract.sh and upgrade-path.sh each build several
      # isolated app instances, and an instance is a DATABASE now.
      SKEIN_DATABASE_URL: postgresql://skein:skein@localhost:5432/skein
      SKEIN_CONTRACT_RUN_ID: ci
      SKEIN_RELEASE_DIST: ${{ github.workspace }}/dist
    steps:
      - name: Checkout
        run: |
          base="${{ github.server_url }}"
          git clone --depth 50 "${base%%://*}://${{ secrets.CI_CHECKOUT_USER }}:${{ secrets.CI_CHECKOUT_TOKEN }}@${base#*://}/${{ github.repository }}.git" .
          git checkout "$GITHUB_SHA"
          git fetch --unshallow --quiet
      - uses: actions/download-artifact@v4
        with:
          name: release-packages
          path: dist
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          # The backend and e2e jobs already cache pip. This job installs the
          # same dependency set and was the only one paying full download.
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            examples/workplace-extension/package-lock.json
      - uses: azure/setup-kubectl@v4
      - name: Install
        run: |
          python -m venv backend/.venv
          backend/.venv/bin/pip install -e "backend[dev]"
          npm --prefix frontend ci
      - name: Backend package contract
        # psql guard: the self-hosted runner image ships no PostgreSQL
        # client, and the script creates its databases with psql.
        run: |
          if ! command -v psql >/dev/null; then apt-get update -qq && apt-get install -y -qq postgresql-client; fi
          ./scripts/reference-extension-contract.sh
      - name: Frontend package contract
        run: ./scripts/reference-frontend-contract.sh
      - name: Deployment contract
        run: ./scripts/reference-deployment-contract.sh
      - name: Derivative image contract
        run: ./scripts/reference-images-contract.sh
      - name: Audit workplace production dependencies
        run: ./scripts/audit-deps.sh workplace

  publish:
    # Tag-triggered, so it stays inside the push-only rule at the top of this
    # file: no untrusted pull_request code ever runs on this host. Needs
    # PACKAGE_TOKEN with packages:write on the Gitea instance. Until that
    # secret exists the job fails loudly rather than publishing nothing
    # quietly, because a release that publishes nowhere is the failure this
    # job exists to prevent.
    if: startsWith(github.ref, 'refs/tags/v')
    # Every gate first. Without this a tag on any commit publishes a wheel
    # built from a tree that no test ever ran against.
    needs: [packages, backend, frontend, extension-contracts, e2e]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        run: |
          base="${{ github.server_url }}"
          git clone --depth 50 "${base%%://*}://${{ secrets.CI_CHECKOUT_USER }}:${{ secrets.CI_CHECKOUT_TOKEN }}@${base#*://}/${{ github.repository }}.git" .
          git checkout "$GITHUB_SHA"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check the tag names the declared version
        # A tag of v0.3.0 on a tree that declares 0.2.2 publishes mismatched
        # Python and npm artifacts, and nothing else notices.
        run: |
          declared="$(sed -n 's/^version = "\(.*\)"/\1/p' backend/pyproject.toml | head -1)"
          if [ "${GITHUB_REF_NAME#v}" != "$declared" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match declared version $declared" >&2
            exit 1
          fi
      - name: Download the tested release packages
        uses: actions/download-artifact@v4
        with:
          name: release-packages
          path: dist
      - name: Publish the wheel
        # Publish first because both npm uploads are retry-safe. --check-url
        # makes a lost upload response safe to retry without changing bytes.
        env:
          TOKEN: ${{ secrets.PACKAGE_TOKEN }}
        run: |
          [ -n "$TOKEN" ] || { echo "PACKAGE_TOKEN is required" >&2; exit 1; }
          base="${{ github.server_url }}"
          uv publish \
            --publish-url "$base/api/packages/${{ github.repository_owner }}/pypi" \
            --check-url "$base/api/packages/${{ github.repository_owner }}/pypi/simple" \
            --username "${{ secrets.CI_CHECKOUT_USER }}" --password "$TOKEN" dist/*.whl
      - name: Publish the npm packages
        # API first: the host declares it as a peer and must never become
        # installable while that exact API version is absent.
        env:
          TOKEN: ${{ secrets.PACKAGE_TOKEN }}
          NPM_CONFIG_USERCONFIG: /tmp/skein-release-npmrc
        run: |
          [ -n "$TOKEN" ] || { echo "PACKAGE_TOKEN is required" >&2; exit 1; }
          trap 'rm -f "$NPM_CONFIG_USERCONFIG"' EXIT
          base="${{ github.server_url }}"
          registry="${base#*://}"
          url="$base/api/packages/${{ github.repository_owner }}/npm/"
          npm config set "//$registry/api/packages/${{ github.repository_owner }}/npm/:_authToken" "$TOKEN"
          publish_package() {
            local package_dir="$1" archive="$2"
            local name version
            name="$(node -p "require('./$package_dir/package.json').name")"
            version="$(node -p "require('./$package_dir/package.json').version")"
            if remote_integrity="$(npm view "$name@$version" dist.integrity --registry "$url" 2>/dev/null)"; then
              local local_integrity
              local_integrity="sha512-$(node -e "const fs=require('node:fs'),crypto=require('node:crypto'); process.stdout.write(crypto.createHash('sha512').update(fs.readFileSync(process.argv[1])).digest('base64'))" "$archive")"
              if [ "$remote_integrity" != "$local_integrity" ]; then
                echo "$name@$version exists with different package bytes" >&2
                exit 1
              fi
              echo "$name@$version already has the tested package bytes."
            else
              npm publish "$archive" --registry "$url"
            fi
          }
          publish_package frontend/packages/extension-api dist/skein-extension-api-*.tgz
          publish_package frontend dist/skein-frontend-host-*.tgz

  e2e:
    # a real browser walking the real app against a seeded mock-provider
    # backend: console errors, failed requests, and an axe scan per page.
    # Needs both toolchains, so it is its own job.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        run: |
          base="${{ github.server_url }}"
          git clone --depth 50 "${base%%://*}://${{ secrets.CI_CHECKOUT_USER }}:${{ secrets.CI_CHECKOUT_TOKEN }}@${base#*://}/${{ github.repository }}.git" .
          git checkout "$GITHUB_SHA"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend
        working-directory: backend
        # the e2e config boots uvicorn from .venv, same path as local runs
        run: python -m venv .venv && .venv/bin/pip install -e .
      - name: Cache the Chromium download
        uses: actions/cache@v4
        id: playwright
        with:
          path: ~/.cache/ms-playwright
          # Playwright pins a browser build per release, so the lockfile is
          # the whole key: a @playwright/test bump must miss this cache.
          key: playwright-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}
      - name: Install frontend
        working-directory: frontend
        # install-deps is the apt half and is NOT in the cached path, so it
        # runs on a hit too. Only the browser download is skipped.
        run: |
          npm ci
          if [ "${{ steps.playwright.outputs.cache-hit }}" = "true" ]; then
            npx playwright install-deps chromium
          else
            npx playwright install --with-deps chromium
          fi
      - name: Smoke
        working-directory: frontend
        run: npx playwright test
      - name: Sign-in smoke (oidc)
        working-directory: frontend
        # oidc is the production auth mode, and the suite above walks
        # trusted-header. Its own config because NEXT_PUBLIC_API_URL is baked
        # at build time, so it needs a second backend and a second build.
        run: npx playwright test --config playwright.oidc.config.ts
