# push-only by design: the runner lives on the production box with docker
# access, so untrusted pull_request code must never execute here. Re-add a PR
# trigger only after moving the runner to an ephemeral sandboxed host.
#
# Manual clone instead of actions/checkout: this Gitea instance 403s the
# `x-access-token` basic-auth username the action hardcodes; user:token works.
name: ci
on:
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        run: |
          git clone --depth 50 "https://OWNER:${{ secrets.CI_CHECKOUT_TOKEN }}@gitea.example.com/OWNER/skein.git" .
          git checkout "$GITHUB_SHA"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        working-directory: backend
        run: pip install -e ".[dev]"
      - name: Lint
        working-directory: backend
        run: |
          ruff check app tests seed.py ../cli/strands_cli.py
          ruff format --check app tests seed.py ../cli/strands_cli.py
          mypy
          vulture
      - name: Test
        working-directory: backend
        env:
          STRANDS_MODEL_PROVIDER: mock
          STRANDS_SCHEDULER: "0"
        run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        run: |
          git clone --depth 50 "https://OWNER:${{ secrets.CI_CHECKOUT_TOKEN }}@gitea.example.com/OWNER/skein.git" .
          git checkout "$GITHUB_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install
        working-directory: frontend
        run: npm ci
      - name: Lint
        working-directory: frontend
        run: |
          npm run lint
          npm run knip
      - name: Build
        working-directory: frontend
        run: npm run build
