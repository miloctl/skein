[project]
name = "skein-cli"
version = "0.2.0"
description = "Skein — the team platform from your terminal (stdlib only)"
requires-python = ">=3.10"

[project.scripts]
skein = "strands_cli:main"
strands = "strands_cli:main"  # legacy alias; muscle memory matters

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["strands_cli"]
