[project]
name = "skein-cli"
version = "0.2.3"
description = "Skein — the team platform from your terminal (stdlib only)"
requires-python = ">=3.12"

[project.scripts]
skein = "skein_cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["skein_cli"]
