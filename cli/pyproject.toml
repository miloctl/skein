[project]
name = "strands-cli"
version = "0.1.0"
description = "Strands Team Platform from your terminal (stdlib only)"
requires-python = ">=3.10"

[project.scripts]
strands = "strands_cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["strands_cli"]
