# Two database passwords are REQUIRED and have no defaults — compose refuses
# to start without them:
#   SKEIN_DB_ADMIN_PASSWORD  the bootstrap superuser, used once at init
#   SKEIN_DB_PASSWORD        the role the app connects as (NOSUPERUSER)
# A shipped default is a shipped credential: this file is documented for team
# access over a VM hostname, and the one password nobody changes is the one
# that came in the file.
#
# One knob for team access: set SKEIN_HOST to the VM's hostname/IP so
# teammates' browsers can reach both services, e.g.
#   SKEIN_HOST=my-vm.internal docker compose up --build
# NEXT_PUBLIC_* values are BAKED AT BUILD TIME — changing SKEIN_HOST,
# SKEIN_API_TOKEN or SKEIN_FRONTEND_PORT requires `up --build`, not just a
# restart.
services:
  db:
    # Pin the MAJOR version. backend/Dockerfile installs a pg_dump pinned to
    # the same major, and pg_dump refuses a server newer than itself — a
    # floating `postgres:latest` here breaks the Backups feature on the next
    # image pull, not on the next deploy.
    image: postgres:17-alpine
    environment:
      # The BOOTSTRAP superuser, used once to initialise the cluster.
      POSTGRES_USER: skein_admin
      POSTGRES_PASSWORD: ${SKEIN_DB_ADMIN_PASSWORD:?set SKEIN_DB_ADMIN_PASSWORD}
      POSTGRES_DB: skein
      # The role the app connects as — created by the init script below with
      # NOSUPERUSER, because a superuser can run shell commands on this
      # container through SQL. /health reports it if the app ever connects as
      # one anyway.
      SKEIN_APP_USER: skein
      SKEIN_APP_PASSWORD: ${SKEIN_DB_PASSWORD:?set SKEIN_DB_PASSWORD}
    volumes:
      - skein-db:/var/lib/postgresql/data
      # The SAME script the Kubernetes ConfigMap carries, so dev rehearses the
      # deployment's privilege model rather than a looser one.
      - ./deploy/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U skein_admin -d skein"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  backend:
    build: ./backend
    init: true
    ports:
      - "8000:8000"
    depends_on:
      db:
        # Migrations run at startup, so the backend must not boot into a
        # refused connection and crash-loop while the database initializes.
        condition: service_healthy
    volumes:
      - skein-data:/data
      # Off-box backup mirror: uncomment (with your mount) to enable in docker.
      # - /mnt/nas-backups/skein:/backup-mirror
      # Deployment overlays: mount your own playbooks/personas/flocks, then
      # set the matching env vars below.
      # - ./deploy/playbooks:/overlay/playbooks:ro
      # - ./deploy/personas:/overlay/personas:ro
      # - ./deploy/flocks:/overlay/flocks:ro
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      # Components, never an interpolated URI: a password holding @ : / % ?
      # or # parses as URL structure and the app cannot connect. The backend
      # composes the conninfo (config._database_url). :? like the db service
      # above, not :-skein — the db service refuses to start without the
      # variable, so a default here would only ever connect a lone backend
      # as skein/skein, the credential this file's header says does not exist.
      # Empty on purpose, and it must stay: `environment` beats env_file, so
      # this shadows a copied backend/.env whose SKEIN_DATABASE_URL points at
      # localhost — which inside this container is the backend itself. Config
      # strips the empty string and the components below win.
      SKEIN_DATABASE_URL: ""
      SKEIN_DB_HOST: db
      SKEIN_DB_PORT: "5432"
      SKEIN_DB_USER: skein
      SKEIN_DB_PASSWORD: ${SKEIN_DB_PASSWORD:?set SKEIN_DB_PASSWORD}
      SKEIN_DB_NAME: skein
      SKEIN_CORS_ORIGINS: "http://${SKEIN_HOST:-localhost}:${SKEIN_FRONTEND_PORT:-3000}"
      # Same shell var feeds backend enforcement AND the frontend build arg,
      # so the two can't drift. (backend/.env can still override the rest.)
      SKEIN_API_TOKEN: ${SKEIN_API_TOKEN:-}
      # This stack is the trusted-network dev rehearsal, so it opts into the
      # name picker; the shipped default is api-key (fail closed). This
      # `environment` entry beats backend/.env — to run another mode here,
      # set SKEIN_AUTH_MODE in the host shell, not only in that file.
      SKEIN_AUTH_MODE: ${SKEIN_AUTH_MODE:-trusted-header}
      # Inside a container, "localhost" is the container — reach the host's
      # Ollama daemon via the host gateway (overrides backend/.env's value).
      SKEIN_OLLAMA_HOST: ${SKEIN_OLLAMA_HOST:-http://host.docker.internal:11434}
      # Mirror target inside the container; pairs with the volume above.
      # SKEIN_BACKUP_MIRROR: /backup-mirror
      # Overlay dirs inside the container; pair with the volumes above.
      # SKEIN_PLAYBOOKS_DIR: /overlay/playbooks
      # SKEIN_PERSONAS_DIR: /overlay/personas
      # SKEIN_FLOCKS_DIR: /overlay/flocks
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        # The URL the BROWSER uses to reach the backend.
        NEXT_PUBLIC_API_URL: "http://${SKEIN_HOST:-localhost}:8000"
        NEXT_PUBLIC_API_TOKEN: ${SKEIN_API_TOKEN:-}
        # The web app's own origin, for metadataBase. Carries the host port,
        # which NEXT_PUBLIC_API_URL does not — the frontend port is a knob.
        NEXT_PUBLIC_SITE_URL: "http://${SKEIN_HOST:-localhost}:${SKEIN_FRONTEND_PORT:-3000}"
    init: true
    ports:
      # Host port is a knob — if another app owns :3000 on the host, use
      # e.g. SKEIN_FRONTEND_PORT=3100 docker compose up --build -d
      - "${SKEIN_FRONTEND_PORT:-3000}:3000"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  skein-data:
  skein-db:
