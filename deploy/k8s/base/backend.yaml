# Single-replica by design, not by accident. The DATABASE no longer requires
# it — PostgreSQL takes concurrent writers, and the check-then-write paths
# hold real locks (db.py::name_lock, policy_context.hold_resource). What
# still assumes one process: artifacts and exports on a ReadWriteOnce volume
# (a second replica serves 404s for half of them), the in-process scheduler,
# per-process rate-cap windows (app/ratelimit.py), and the chat turn registry
# (routes/chat.py::_inflight). Raising replicas corrupts no data now, but it
# double-fires the scheduler and halves every rate cap — do not raise it
# until those three move.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: skein-backend
  labels:
    app: skein-backend
spec:
  replicas: 1
  # Recreate, never RollingUpdate: the data PVC is ReadWriteOnce, so a surge
  # pod wedges Pending on the volume attach. Migrations are safe either way
  # now — init_db takes an advisory lock, so two booting pods serialize
  # instead of racing — but the volume still admits one mounter. The cost is
  # seconds of downtime per upgrade, accepted in deploy/k8s/README.md.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: skein-backend
  template:
    metadata:
      labels:
        app: skein-backend
    spec:
      # 210s: an agent chat turn tolerates 180s of member silence
      # (routes/chat.py) — the default 30s grace kills mid-turn transcripts.
      terminationGracePeriodSeconds: 210
      securityContext:
        runAsNonRoot: true
        # No runAsUser and no fsGroup: OpenShift restricted-v2 assigns both
        # from the namespace range and REJECTS values outside it. A
        # hardcoded fsGroup fails admission; the assigned one makes the
        # PVCs group-writable, which is all the app needs.
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: backend
          image: skein
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          ports:
            - name: http
              containerPort: 8000
          env:
            # Composed here rather than stored whole, so the password stays in
            # the Secret and the host stays in the ConfigMap. The backend
            # refuses to start without it (config.py) — there is no default
            # that could quietly serve an empty database instead.
            # Host and port come from the ConfigMap through an explicit
            # configMapKeyRef, NOT through envFrom: $() expansion only sees
            # names defined earlier in THIS list, so an envFrom value would
            # reach SKEIN_DATABASE_URL below as the literal text
            # "$(SKEIN_DB_HOST)" and the pod would try to resolve that as a
            # hostname.
            - name: SKEIN_DB_HOST
              valueFrom:
                configMapKeyRef:
                  name: skein-config
                  key: SKEIN_DB_HOST
            - name: SKEIN_DB_PORT
              valueFrom:
                configMapKeyRef:
                  name: skein-config
                  key: SKEIN_DB_PORT
            # The APPLICATION role, not the bootstrap superuser that
            # initialised the cluster. A superuser can COPY ... FROM PROGRAM,
            # which runs shell commands on the database pod — see the reason
            # written out in base/postgres.yaml. /health reports it if this
            # ever points at a superuser again.
            - name: SKEIN_DB_USER
              valueFrom:
                secretKeyRef:
                  name: skein-db-secret
                  key: SKEIN_APP_USER
            - name: SKEIN_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: skein-db-secret
                  key: SKEIN_APP_PASSWORD
            - name: SKEIN_DB_NAME
              valueFrom:
                secretKeyRef:
                  name: skein-db-secret
                  key: POSTGRES_DB
            - name: SKEIN_DATABASE_URL
              value: >-
                postgresql://$(SKEIN_DB_USER):$(SKEIN_DB_PASSWORD)@$(SKEIN_DB_HOST):$(SKEIN_DB_PORT)/$(SKEIN_DB_NAME)
          envFrom:
            - configMapRef:
                name: skein-config
            # Model keys, SKEIN_FORGE_WEBHOOK_SECRET, SKEIN_ICS_TOKEN.
            # Optional: a keyless (mock) deployment needs no Secret at all.
            - secretRef:
                name: skein-secrets
                optional: true
          # Startup runs migrations plus catch-up jobs (a full DB backup on
          # the first boot of a day) before uvicorn answers anything —
          # /health included. The startup probe carries that whole window;
          # liveness without it kills the pod mid-migration into a
          # crash-loop that can never finish.
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
          # Starting sizes, not measured ones. Measure uvicorn under real
          # load and tighten (TODO.md, single-replica posture).
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
          volumeMounts:
            # Artifacts, exports and the local backup copies. NO database:
            # that is skein-db's own volume.
            - name: data
              mountPath: /data
            - name: backup-mirror
              mountPath: /backup-mirror
            # readOnlyRootFilesystem leaves no scratch space for provider
            # SDKs and stdlib tempfile.
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: skein-data
        - name: backup-mirror
          persistentVolumeClaim:
            claimName: skein-backup-mirror
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: skein-backend
  labels:
    app: skein-backend
spec:
  selector:
    app: skein-backend
  ports:
    - name: http
      port: 8000
      targetPort: http
---
# Block storage only (RWO). No database lives here any more — this volume
# holds artifacts/, exports/ and the local backup copies. RWO is still
# deliberate: one pod mounting it is what keeps the backup writer single,
# and the failed attach of a second pod is what enforces `replicas: 1` and
# `strategy: Recreate` (see the Deployment comment above for everything
# else that pins one replica). An RWX class would not corrupt these files —
# it would silently remove that enforcement.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: skein-data
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
# The mirror only earns its place on a storage backend independent of
# skein-data — same class, same array means one fault takes both copies and
# the anchor-log comparison proves nothing. Pick the class in the overlay,
# or accept the reduced guarantee in writing (deploy/k8s/README.md).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: skein-backup-mirror
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
