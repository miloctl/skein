# Single-replica by design, not by accident. The DATABASE no longer requires
# it — PostgreSQL takes concurrent writers, and the check-then-write paths
# hold real locks (db.py::name_lock, policy_context.hold_resource). What
# still assumes one process: artifacts and exports on a ReadWriteOnce volume
# (a second replica serves 404s for half of them), the in-process scheduler,
# per-process rate-cap windows (app/ratelimit.py), the chat turn registry
# (routes/chat.py::_inflight), and the shared-chat agent worker
# (services/shared_chat_agents.py serializes each model session with a
# process-local lock, and recover_startup() at boot clears every execution
# lease — a second replica booting marks the first replica's live turns
# completion_unknown and lets a queued turn write the same model session).
# Raising replicas double-fires the scheduler, halves every rate cap, and
# corrupts in-flight shared-chat agent sessions — do not raise it until
# those move.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: skein-backend
  labels:
    app: skein-backend
spec:
  replicas: 1
  # Recreate, never RollingUpdate: two pods on one node can both mount an RWO
  # volume, so RWO is not the safety boundary. Recreate prevents overlapping
  # file readers, schedulers, and per-process rate caps during an upgrade. The
  # cost is seconds of downtime, accepted in deploy/k8s/README.md.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: skein-backend
  template:
    metadata:
      labels:
        app: skein-backend
    spec:
      # No container calls the Kubernetes API. A projected token gives a
      # compromised container unnecessary namespace credentials.
      automountServiceAccountToken: false
      # 210s: an agent chat turn tolerates 180s of member silence
      # (routes/chat.py) — the default 30s grace kills mid-turn transcripts.
      terminationGracePeriodSeconds: 210
      securityContext:
        runAsNonRoot: true
        # No runAsUser and no fsGroup: OpenShift restricted-v2 assigns both
        # from the namespace range and REJECTS values outside it. A
        # hardcoded fsGroup fails admission; the assigned one makes the
        # PVCs group-writable, which is all the app needs.
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: backend
          image: skein
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          ports:
            - name: http
              containerPort: 8000
          env:
            # Components rather than one stored URL, so the password stays in
            # the Secret and the host stays in the ConfigMap. The backend
            # refuses to start without them (config.py) — there is no default
            # that could quietly serve an empty database instead.
            - name: SKEIN_DB_HOST
              valueFrom:
                configMapKeyRef:
                  name: skein-config
                  key: SKEIN_DB_HOST
            - name: SKEIN_DB_PORT
              valueFrom:
                configMapKeyRef:
                  name: skein-config
                  key: SKEIN_DB_PORT
            # The APPLICATION role, not the bootstrap superuser that
            # initialised the cluster. A superuser can COPY ... FROM PROGRAM,
            # which runs shell commands on the database pod — see the reason
            # written out in base/postgres.yaml. /health reports it if this
            # ever points at a superuser again.
            - name: SKEIN_DB_USER
              valueFrom:
                secretKeyRef:
                  name: skein-db-secret
                  key: SKEIN_APP_USER
            - name: SKEIN_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: skein-db-secret
                  key: SKEIN_APP_PASSWORD
            # No SKEIN_DATABASE_URL here on purpose: the backend composes the
            # conninfo from these components (config._database_url), so a
            # generated password holding @ : / % ? or # never breaks URI
            # parsing. Do not reintroduce a URI built by interpolation —
            # scripts/reference-deployment-contract.sh refuses the render.
            - name: SKEIN_DB_NAME
              valueFrom:
                secretKeyRef:
                  name: skein-db-secret
                  key: POSTGRES_DB
          envFrom:
            - configMapRef:
                name: skein-config
            # Model keys, SKEIN_FORGE_WEBHOOK_SECRET, SKEIN_ICS_TOKEN.
            # Optional: a keyless (mock) deployment needs no Secret at all.
            - secretRef:
                name: skein-secrets
                optional: true
          # Startup runs migrations plus catch-up jobs (a full DB backup and
          # configured mirror copy on the first boot of a day) before uvicorn answers —
          # /health included. The startup probe carries that whole window;
          # liveness without it kills the pod mid-migration into a
          # crash-loop that can never finish.
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            failureThreshold: 150
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
          # Starting sizes, not measured ones. Measure uvicorn under real
          # load and tighten (TODO.md, single-replica posture).
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
          volumeMounts:
            # Artifacts, exports and the local backup copies. NO database:
            # that is skein-db's own volume.
            - name: data
              mountPath: /data
            - name: backup-mirror
              mountPath: /backup-mirror
            # readOnlyRootFilesystem leaves no scratch space for provider
            # SDKs and stdlib tempfile.
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: skein-data
        - name: backup-mirror
          persistentVolumeClaim:
            claimName: skein-backup-mirror
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: skein-backend
  labels:
    app: skein-backend
spec:
  selector:
    app: skein-backend
  ports:
    - name: http
      port: 8000
      targetPort: http
---
# Block storage only (RWO). No database lives here any more — this volume
# holds artifacts, exports, and local backup copies. RWO limits cross-node
# mounting, not pod count. `replicas: 1` and `strategy: Recreate` are the
# boundaries that keep file readers and the scheduler single.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: skein-data
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      # 14 full and 14 public dumps can each approach the 10Gi database
      # request. The remaining headroom holds one portable export, artifacts,
      # and temporary files.
      storage: 360Gi
---
# The mirror only earns its place on a storage backend independent of
# skein-data — same class, same array means one fault takes both copies and
# the anchor-log comparison proves nothing. Pick the class in the overlay,
# or accept the reduced guarantee in writing (deploy/k8s/README.md).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: skein-backup-mirror
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      # 30 public dumps can each approach the 10Gi database request.
      storage: 320Gi
