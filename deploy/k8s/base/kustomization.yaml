apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - postgres.yaml
  - network-policy.yaml
  - backend.yaml
  - frontend.yaml
  - routes.yaml

# The generator hash-suffixes the name, so a config change rolls the pods.
# Overlays merge site values in with `behavior: merge`.
configMapGenerator:
  - name: skein-config
    literals:
      # The OpenShift router is one trusted hop. At 0 every caller shares
      # the router's rate bucket; above the real depth the bucket key is
      # spoofable (config.py).
      - SKEIN_TRUST_PROXY_HOPS=1
      # Existing second volume for the core public-schema dump and anchor log.
      # It does not contain private schemas, extension schemas, or artifacts.
      # An independent storage backend is what makes the anchor comparison
      # meaningful.
      - SKEIN_BACKUP_MIRROR=/backup-mirror
      # The database. The HOST is here because it is not a secret; the
      # credentials live in skein-db-secret, and the backend composes the
      # conninfo from the components (config._database_url). Point this at a
      # managed server and delete postgres.yaml to use one.
      - SKEIN_DB_HOST=skein-db
      - SKEIN_DB_PORT=5432
      # Keyless default. Overlays set a real provider and its Secret.
      - SKEIN_MODEL_PROVIDER=mock

# Overlays MUST set both images to the site registry and a version tag.
# The frontend bakes NEXT_PUBLIC_API_URL at build time, so its tag names an
# environment (0.5.0-prod), never a bare version — one frontend image cannot
# serve two environments.
images:
  - name: skein
  - name: skein-frontend
