# PostgreSQL, self-managed. Deliberately NOT an operator: this deployment
# runs one small database for one small team, and an operator is a second
# control plane to learn, upgrade and debug at 3am. If the org already offers
# a managed PostgreSQL, delete this file, point SKEIN_DB_HOST (and the
# credential Secret) at that server, and nothing else here changes.
#
# The image tag pins a MAJOR version and must match the pg_dump the backend
# image installs (backend/Dockerfile, PG_MAJOR). pg_dump refuses a server
# newer than itself, and the failure lands in the nightly backup job rather
# than at boot — the daily copy just stops being written.
#
# A StatefulSet, not a Deployment: it gives the volume a stable identity and
# refuses to run two pods against one data directory, which is exactly the
# mistake that corrupts a database cluster.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: skein-db
  labels:
    app: skein-db
spec:
  serviceName: skein-db
  replicas: 1
  selector:
    matchLabels:
      app: skein-db
  template:
    metadata:
      labels:
        app: skein-db
    spec:
      # postgres:17-alpine uses SIGINT (fast shutdown). This is the maximum
      # time for its clean checkpoint before kubelet escalates to SIGKILL.
      terminationGracePeriodSeconds: 1200
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: postgres:17-alpine
          ports:
            - name: postgres
              containerPort: 5432
          env:
            # POSTGRES_PASSWORD initialises the cluster on FIRST boot only.
            # Changing it later changes nothing in the database; use ALTER
            # ROLE and update the Secret together.
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: skein-db-secret
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: skein-db-secret
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: skein-db-secret
                  key: POSTGRES_DB
            # The image initialises into $PGDATA. A subdirectory, never the
            # mount root: a PVC's lost+found makes the root non-empty, and
            # initdb refuses a non-empty directory.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
            # Read by the initdb script, not by the server.
            - name: SKEIN_APP_USER
              valueFrom:
                secretKeyRef:
                  name: skein-db-secret
                  key: SKEIN_APP_USER
            - name: SKEIN_APP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: skein-db-secret
                  key: SKEIN_APP_PASSWORD
          # pg_isready, not a TCP check: the port accepts connections while
          # the cluster is still recovering, and the backend would then boot
          # into a refused query and crash-loop through its migrations.
          startupProbe:
            exec:
              command: ["pg_isready", "-U", "$(POSTGRES_USER)", "-d", "$(POSTGRES_DB)"]
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 180
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "$(POSTGRES_USER)", "-d", "$(POSTGRES_DB)"]
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "$(POSTGRES_USER)", "-d", "$(POSTGRES_DB)"]
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
          # Starting sizes, not measured ones — same honesty as the backend's.
          # shared_buffers defaults to 128MB, so the limit must clear that
          # plus per-connection work_mem or the OOM killer takes the cluster.
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: pgdata
              mountPath: /var/lib/postgresql/data
            # initdb runs *.sql here on the first boot of an empty volume.
            - name: init
              mountPath: /docker-entrypoint-initdb.d
      volumes:
        - name: init
          configMap:
            name: skein-db-init
  # volumeClaimTemplates, not a bare PVC: the volume belongs to the pod
  # identity, and deleting the StatefulSet leaves it behind rather than
  # taking the database with it.
  volumeClaimTemplates:
    - metadata:
        name: pgdata
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 10Gi
---
# Headless: the StatefulSet addresses one pod, and there is nothing to load
# balance across. The backend connects to skein-db:5432.
apiVersion: v1
kind: Service
metadata:
  name: skein-db
  labels:
    app: skein-db
spec:
  clusterIP: None
  selector:
    app: skein-db
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
# initdb runs this ONCE, on the first boot of an empty volume. It creates the
# role the application actually connects as.
#
# The application must NOT be a superuser. A superuser can COPY ... FROM
# PROGRAM, which executes shell commands on this pod as the postgres OS user,
# and pg_read_file, which reads its filesystem — so every SQL bug, and every
# buggy extension (ExtensionStore takes raw SQL), escalates from "reads some
# rows" to running commands on the database container. SQLite had no
# SQL-reachable exec primitive at all; this restores the bound.
apiVersion: v1
kind: ConfigMap
metadata:
  name: skein-db-init
data:
  # A shell script, not a .sql file: the entrypoint runs both, and this way
  # the credentials stay in psql variables passed by the shell rather than in
  # meta-commands whose quoting is easy to get subtly wrong.
  # Idempotent and atomic: the entrypoint runs this only on the first boot of
  # an empty volume, so a crash mid-init would otherwise leave a partial role
  # configuration that no restart ever repairs. Every statement converges, and
  # --single-transaction makes a failed run leave nothing. To repair a broken
  # bootstrap, re-run this script by hand as the superuser.
  10-app-role.sh: |
    #!/bin/bash
    set -euo pipefail
    connection=(--username "$POSTGRES_USER" --dbname "$POSTGRES_DB")
    if [[ -n ${POSTGRES_CONNINFO:-} ]]; then
      connection=(--dbname "$POSTGRES_CONNINFO")
    fi
    psql -v ON_ERROR_STOP=1 --single-transaction \
      "${connection[@]}" \
      -v app_user="$SKEIN_APP_USER" -v app_password="$SKEIN_APP_PASSWORD" \
      -v dbname="$POSTGRES_DB" <<-'EOSQL'
        SELECT format('CREATE ROLE %I', :'app_user')
        WHERE NOT EXISTS (SELECT FROM pg_roles WHERE rolname = :'app_user')
        \gexec
        ALTER ROLE :"app_user" LOGIN PASSWORD :'app_password'
            NOSUPERUSER NOCREATEDB NOCREATEROLE NOBYPASSRLS;
        GRANT CONNECT ON DATABASE :"dbname" TO :"app_user";
        -- CREATE as well as USAGE: the application applies its own migrations
        -- at startup, so it must be able to create tables in this schema.
        GRANT USAGE, CREATE ON SCHEMA public TO :"app_user";
        -- The app role owns only this dedicated private schema. It does not get
        -- database-wide CREATE, which would let it manufacture arbitrary schemas.
        CREATE SCHEMA IF NOT EXISTS private AUTHORIZATION :"app_user";
        ALTER SCHEMA private OWNER TO :"app_user";
    EOSQL
