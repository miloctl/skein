# Field-guide registry. Presentation + metadata ONLY — predicates live in
# app/services/fieldguide.py keyed by id (SQL belongs in the service layer).
# The loader fails loudly if a card has no predicate or a predicate no card.
#
# Fields: id (predicate key) · feature (primary label) · knot (flavor
# subtitle) · set (loops|hitches|bends|stoppers|manager) · pitch (one line,
# why it exists) · how (terse how-to, craft-manual voice) · link (in-app
# deep link, must start with /) · since (YYYY-MM-DD the card entered the
# guide — feeds the feature_unadopted grace window) · role (optional:
# "manager" marks cards for the manager toggle so IC completionists know).
#
# Voice rules: dry, terse, no exclamation marks, no praise adjectives.
#
# Write the SEARCH shortcut as the literal ⌘K. It is a TOKEN, not the text
# the reader gets: the guide page renders pitch/how through
# components/shortcut.tsx, which spells it ⌘K on an Apple keyboard and Ctrl+K
# on every other one. Writing "Ctrl+K" here defeats that and is then wrong on
# a Mac.
# Never add counters, streaks, or tiers. Shipping a user-facing feature?
# Add its card in the same PR — a new locked card IS the release note.
#
# When adding a card: `since` is TODAY's date, not a copy-paste — a copied
# old date ships with the feature_unadopted grace window already expired and
# fires a finding in week one. The registry is cached at startup and only
# re-read on restart (uvicorn --reload watches *.py, not *.yaml).

knots:
  # ---- Loops — the solo basics ----------------------------------------
  - id: capture
    feature: Quick capture
    knot: Overhand
    set: loops
    pitch: One box that files todos, questions, blockers, decisions, and promises.
    how: "Select Capture in the top bar. Try `todo: …`, `q: …`, or `blocked on …`. The preview shows what it will file as. A task starts assigned to you, and My Day refreshes after capture."
    link: /
    since: 2026-07-31

  - id: standup
    feature: Standups
    knot: Slip Knot
    set: loops
    pitch: Yesterday prefills itself from your own activity; blockers auto-file.
    how: Post one from My Day — the composer already knows what you did yesterday.
    link: /
    since: 2026-07-31

  - id: guided_first_week
    feature: Guided first week
    knot: Double Bowline
    set: loops
    pitch: Your own line stays clear while the full formation waits one step back.
    how: Complete one capture and one standup. Until then, My Day keeps team context behind Show team context. Select dismiss to use the full page now.
    link: /
    since: 2026-08-15

  - id: todays_three
    feature: Today's Three
    knot: Trinity Knot
    set: loops
    ties: mark
    pitch: Three strands held close enough to pull the day in one direction.
    how: On My Day, select add beside up to three assigned tasks. The selection stays in this browser and resets on the next team date.
    link: /
    since: 2026-08-15

  - id: task_done
    feature: Finish a task
    knot: Figure-Eight Loop
    set: loops
    pitch: Done tasks feed cycle time, throughput, and the slip forecast.
    how: Mark any task of yours done on Work → Browse. Open work stays in Tasks, and work from the last 7 days stays in Recently shipped.
    link: /dashboard
    since: 2026-07-31

  - id: decision
    feature: Decisions with a half-life
    knot: Bowline
    set: loops
    pitch: Decisions expire to stale unless reconfirmed — nothing is trusted forever.
    how: "`decision: …` in quick capture, then set a review-by date. The daily sweep does the rest."
    link: /charter
    since: 2026-07-31

  - id: question_asked
    feature: Ask a question
    knot: Angler's Loop
    set: loops
    pitch: Assigned questions notify the assignee and wait visibly.
    how: "`q: who owns the staging cert?` in quick capture, or assign one on Work → Browse."
    link: /dashboard
    since: 2026-07-31

  - id: question_answered
    feature: Answer a question
    # the SAME knot as the Angler's Loop, under its other name — which is
    # the pairing: one knot, seen from the asker's end and the answerer's
    knot: Perfection Loop
    set: loops
    pitch: The Angler's Loop under its other name — someone is waiting on you.
    how: Open questions assigned to you sit on My Day under Unblock.
    link: /
    since: 2026-07-31

  - id: convention
    feature: Convention notes
    knot: Farmer's Loop
    set: loops
    pitch: "`convention:` topics feed the context pack every agent reads."
    how: "Save a note whose topic starts with `convention`, for example how the team names branches."
    link: /dashboard
    since: 2026-07-31

  - id: search
    feature: Search & /ask
    knot: Running Bowline
    set: loops
    # ties when a route calls fieldguide.mark — the feature is a read,
    # so there is no write to detect
    ties: mark
    pitch: Full-text over every entity; /ask answers with receipts, keyless.
    how: "Press ⌘K, or use the nav box, `/search` in chat, or `skein search` in a terminal. Type `#42` and task 42 is the first result. `blocker 3` finds blocker 3. Start the nav box with `?` to widen a query that matches nothing — it retries on the separate words and marks the results as loose."
    link: /chat
    since: 2026-07-31

  - id: timeaway
    feature: Time away
    knot: Honda Knot
    set: loops
    pitch: PTO and focus windows the weekly draft and staffing projections respect.
    how: Log it on Work → Browse, in the Time-away card.
    link: /dashboard
    since: 2026-07-31

  - id: intake
    feature: Intake requests
    knot: Scaffold Knot
    set: loops
    # "conversation" survives the docs/LEXICON.md row-2 sweep here: it names
    # two people talking in a corridor, not a Skein chat. Every other use in
    # this file is the product noun and says "chat". Without this line the next
    # sweep reads it as a straggler and destroys the contrast the sentence is
    # built on.
    pitch: Work enters through a scored queue, not a hallway conversation.
    how: "`req: …` in quick capture or Inbox → Requests. RICE-lite scores it for triage."
    link: /intake
    since: 2026-07-31

  - id: promise
    feature: Promises
    knot: Water Bowline
    set: loops
    pitch: Promises with an audience and a due date, ledgered until settled.
    how: "`promised: demo to client by Friday` records what your team owes. `awaiting: legal — redlines by Friday` records what somebody owes your team."
    link: /portfolio
    since: 2026-07-31

  - id: growth
    feature: Growth interests
    knot: Directional Figure Eight
    set: loops
    pitch: What you want to grow into, visible when staffing decisions happen.
    how: Declare yours in Settings — they show up in what-if staffing.
    link: /settings
    since: 2026-07-31

  - id: chat
    feature: Chat & the bench
    knot: Spanish Bowline
    set: loops
    pitch: The Chief of Staff, the specialist bench, and slash commands that run without a model.
    how: "Open Chat. Try `/help`, or `/as growth-mentor …` to call the bench."
    link: /chat
    since: 2026-07-31

  - id: page_help
    feature: Page help
    knot: Eskimo Bowline
    set: loops
    ties: mark
    pitch: A loose end is easier to tie when the right knot is already beside it.
    how: Open ? in the top bar. Read the page cards, or ask the Bosun.
    link: /
    since: 2026-08-16

  - id: flocks
    feature: Flocks
    # a LOOP knot, matching the loops set — docs/LEXICON.md #6 counts the
    # cards carrying a name from the wrong class, and this must not join them.
    # Bowline on a Bight also earns it: one rope, two loops at one time.
    knot: Bowline on a Bight
    set: loops
    pitch: One question, several specialists, one turn — the disagreement is the point.
    how: "Open Chat. Run `/flocks` to see the groups, then `/flock engineering …`."
    link: /chat
    since: 2026-08-05

  - id: chat_capture
    feature: File it from chat
    knot: Poacher's Knot
    set: loops
    # ties when a route calls fieldguide.mark — the feature is a read,
    # so there is no write to detect
    ties: mark
    pitch: The capture grammar works in chat too — and a turn that files nothing says so.
    how: "In Chat, start a message with `todo:`, `q:`, `decision:`, or `promised:`. If nothing gets filed, the reply says that outright."
    link: /chat
    since: 2026-08-01

  - id: offweb
    feature: CLI & MCP
    knot: Artillery Loop
    set: loops
    pitch: The whole platform without a browser — same DB, same provenance.
    how: "`pipx install ./cli`, then `skein my-day`. The command uses the same Needs you and Team queues as the web page. Settings shows the key setup."
    link: /settings
    since: 2026-07-31

  - id: reports
    feature: Read report history
    knot: Gasket Coil
    set: loops
    ties: mark
    pitch: Every old report stays on the line, and its named threads lead back into the formation.
    how: Open Work → Reports. Select a report. The Threads in this report list shows each reference that you can open. Select one to go to it. Select Older reports to continue through the archive.
    link: /artifacts
    since: 2026-08-15

  - id: ingest
    feature: Meeting-notes ingestion
    knot: Alpine Butterfly
    set: loops
    pitch: Paste raw notes; structure gets pulled out of the middle of the mess as proposals.
    how: Inbox → Paste notes. Every hit waits in Approvals — nothing writes directly.
    link: /ingest
    since: 2026-07-31

  # ---- Hitches — attaching work to an agent ---------------------------
  - id: bosun
    feature: Bosun
    knot: Marlinspike Hitch
    set: hitches
    ties: mark
    pitch: Every deck needs someone who knows where each line runs.
    how: Open the Bosun from this card. Ask how to use a Skein feature.
    link: /chat?as=bosun
    since: 2026-08-16

  - id: delegate
    feature: Delegate to an agent
    knot: Rolling Hitch
    set: hitches
    pitch: A task handed to an agent, with a human sponsor on record.
    how: Pick a task on Work → Browse and delegate it. You become the sponsor. On Team → Agents, Has work shows identities with open tasks or pending proposals. Select All agents to inspect every identity.
    link: /dashboard
    since: 2026-07-31

  - id: activity_feed
    feature: The activity feed
    knot: Snubbing Hitch
    set: hitches
    # ties when a route calls fieldguide.mark — the feature is a read,
    # so there is no write to detect
    ties: mark
    pitch: What the agents did, one sentence per action, next to your own.
    how: "Team → Activity. Loud rows are the destructive ones. The raw toggle shows the ledger rows themselves."
    link: /activity
    since: 2026-08-02

  - id: sponsor_verdict
    feature: Close the delegation loop
    knot: Round Turn & Two Half-Hitches
    set: hitches
    pitch: The agent worked; the worklog shows it; your verdict finishes the job.
    how: When your delegated task lands in Approvals, read the worklog and rule on it. If you reject it, the correction leaves the active agent inbox after you approve its replacement.
    link: /review
    since: 2026-07-31

  - id: mention
    feature: "@mentions"
    knot: Prusik
    set: hitches
    pitch: A name in prose becomes a tap on the shoulder — the knot that grips a moving line.
    how: "Write `@name` in a task, note, question, answer, or decision. In chat, start the message with a capture prefix such as `todo:`. A plain chat message files no record, so a mention in it has nothing to point at. The named person gets one notification. An edit does not notify twice."
    link: /chat
    since: 2026-08-03

  # ---- Bends — where two systems join ---------------------------------

  - id: forge
    feature: Code forge webhook
    knot: Double Fisherman's
    set: bends
    # the forge acts for the whole team under one actor and names nobody, so
    # there is no first USE to attribute to a person. The card is the setup
    # documentation, and it stays that way.
    ties: never
    pitch: The branch drags the task along behind it — one hitch, and the log follows the tow.
    how: "Whoever runs the server sets SKEIN_FORGE_WEBHOOK_SECRET. Add the webhook URL from Settings to your repository with that same secret. Name a branch `task/42-slug`. The push starts task 42, and the merged pull request finishes it."
    link: /settings
    since: 2026-08-03

  - id: standup_blocker
    feature: Standup → blocker
    knot: Sheet Bend
    set: bends
    pitch: A blocker mentioned in a standup files itself, escalation clock running.
    how: Write the blocker line in your standup instead of a separate report — one entry, two systems.
    link: /
    since: 2026-07-31

  - id: chat_engagement
    feature: Bill a chat to its engagement
    knot: Carrick Bend
    set: bends
    pitch: Model spend in a linked chat counts toward that engagement's costs.
    how: "In the chat sidebar, open a thread's menu and pick Link to engagement — pick one, or type a name to create it on the spot. The costs land on /api/usage per engagement."
    link: /chat
    since: 2026-08-02

  - id: consult
    feature: Ask a specialist mid-chat
    # a BEND joins two ropes, which is the shape here: the Chief of Staff and
    # one bench specialist, tied for a single answer. docs/LEXICON.md #6
    # counts cards carrying a name from the wrong class.
    knot: Hunter's Bend
    set: bends
    # ties when the chat route marks it — a consult's spend lands in usage_log
    # under the specialist's slug, and `/as` writes the same row, so no query
    # can tell the two apart. On SKEIN_MODEL_PROVIDER=mock the mark never
    # fires: MockAgent has no tool loop, so no consult can happen. A keyless
    # deployment reaches the bench through the deterministic routes the how:
    # line ends with, and this card stays untied there — accepted, the way
    # `forge` accepts ties: never.
    ties: mark
    pitch: Keep talking to the Chief of Staff, and let it fetch the specialist who actually knows.
    how: "In Chat, name a specialist inside the sentence: ask @code-reviewer about tomorrow's plan. To call one directly, start the message with @ and the slug."
    link: /chat
    since: 2026-08-07

  - id: finding_converted
    feature: Finding → work
    knot: Zeppelin Bend
    set: bends
    pitch: The findings engine noticed something; you turned it into a tracked task.
    how: On Work → Insights, convert a finding. The task keeps the finding severity as its priority, starts assigned to you, and opens in the task panel.
    link: /insights
    since: 2026-07-31

  # ---- Stoppers — the art of finishing --------------------------------
  - id: settle
    feature: Settle a promise
    knot: Ashley Stopper
    set: stoppers
    pitch: Open promises are noise until settled — kept, missed, or withdrawn all count.
    how: Work → Health, the Promises card. Honest beats pretty.
    link: /portfolio
    since: 2026-07-31

  - id: resolve_blocker
    feature: Resolve a blocker
    knot: Wall Knot
    set: stoppers
    pitch: Stops the escalation clock; three-day-old blockers get a funeral.
    how: Resolve one you own on Work → Browse.
    link: /dashboard
    since: 2026-07-31

  - id: close_engagement
    feature: Close an engagement honestly
    knot: Back Splice
    set: stoppers
    pitch: Closing requires a conclusion — invalidated-on-time is a success, not a slip.
    how: Work → Browse, close out… on the engagement. Pick the conclusion that is true. If it started from a playbook, Skein shows the plan variance before you pick.
    link: /dashboard
    since: 2026-07-31

  - id: review
    feature: Review a proposal
    knot: Turk's Head
    set: stoppers
    pitch: Someone proposed; a human verified. Approve and reject both count.
    how: Inbox → Approvals starts with the oldest pending proposal. Select More proposals to continue. A rejection carries a note back to the proposer.
    link: /review
    since: 2026-07-31

  # ---- For managers ---------------------------------------------------
  - id: ritual
    feature: Week rituals
    knot: Chain Sinnet
    set: manager
    role: manager
    pitch: Monday brief and Friday close-out — the week gets opened and settled on purpose.
    how: Run one yourself from manager controls on Work → Health. If it already ran, Skein links the existing report and sends no duplicate notifications. A scheduler run does not count as yours.
    link: /portfolio
    since: 2026-07-31

  - id: authority_half_life
    feature: Renew agent authority
    knot: Safety Knot
    set: manager
    role: manager
    pitch: Trust gets a watch, not a throne.
    how: On Team → Agents, check each elevated grant. After 90 days, re-grant it or keep the required human review.
    link: /agents
    since: 2026-08-15

  - id: readout
    feature: Exec readout
    knot: Flemish Flake
    set: manager
    role: manager
    pitch: The portfolio coiled for showing — health, ships, risks, promises.
    how: Work → Health, under manager controls. It lands as an artifact.
    link: /portfolio
    since: 2026-07-31

  - id: handoff
    feature: Handoff package
    knot: Bowline on a Bight
    set: manager
    role: manager
    pitch: Everything the incoming roster needs, generated deterministically.
    how: Generate one from an engagement on Work → Browse.
    link: /dashboard
    since: 2026-07-31

  - id: model_pick
    feature: Pick the team model
    knot: Adjustable Grip Hitch
    set: manager
    role: manager
    pitch: Slide the whole team onto the right model for the week — no redeploy, no ticket, one knot to shift the load.
    how: On Settings under Model (team), select a model from the menu. The change applies to each chat from its next message.
    link: /settings
    since: 2026-08-08

  - id: playbook_closeout
    feature: Teach the playbook what happened
    knot: Bowline on a Bight
    set: manager
    role: manager
    pitch: The template said six weeks and every one of them ran nine. Close one out and the playbook finally hears about it.
    how: If an engagement started from a playbook, close it on Work → Browse. Skein diffs the plan against what happened and drafts the lesson. Approve it on Review, and the next kickoff of that class reads it.
    link: /dashboard
    since: 2026-08-09

  - id: engagement_brief
    feature: Read an engagement whole
    knot: Carrick Bend
    set: bends
    role: any
    pitch: One piece of work, in one page — what it exists for, why it is red, and what to do about it.
    how: On Work → Browse, select the name of an engagement. The brief shows its outcome and its health with the receipts behind it. It also shows open work, blockers, what an agent carries, and plan drift.
    link: /dashboard
    since: 2026-08-10

  - id: backup
    feature: Manual backup
    knot: Anchor Bend
    set: manager
    role: manager
    pitch: The copy you take on purpose, before the risky change — not the one the scheduler owes you at 03:00.
    how: Open Settings → Backups and select "Back up now". The nightly copy runs without you. This button is for the moment before an upgrade or a bulk change.
    link: /settings
    since: 2026-08-14

  - id: needs_a_call
    feature: See what needs a decision
    knot: Trucker's Hitch
    set: manager
    role: manager
    pitch: Everything that needs a decision, in one list. What is escalated, overdue, unowned or drifting, ranked by what it costs to leave alone.
    how: On Work → Plan the week, read card 2. Each row states what is true, who holds it, and the next move. Follow a receipt to check the claim.
    link: /planning
    since: 2026-08-10

  - id: provenance
    feature: Ask where a row came from
    knot: Prusik Loop
    set: loops
    # ties when the route calls fieldguide.mark — asking the question IS the
    # act, and a read leaves no ledger row to detect
    ties: mark
    role: any
    pitch: Not just who wrote it — who proposed it, who approved it, whether that verdict carried a credential, and what has changed it since.
    how: Open any task panel and select "where did this come from?". The chain reads from the row, the proposal that produced it, and the ledger.
    link: /dashboard
    since: 2026-08-10

  - id: project_memory
    feature: Give a memory a subject
    knot: Sheet Bend
    set: bends
    role: any
    pitch: A fact learned on one piece of work, recalled in chats about that work and nowhere else.
    how: Link a chat to an engagement from the sidebar menu. That chat then recalls the engagement's own memories on top of the team's. Filing one back is a proposal a person approves.
    link: /chat
    since: 2026-08-10

  - id: chat_attachment
    feature: Attach a file to a question
    knot: Timber Hitch
    set: hitches
    role: any
    pitch: The document goes with the question, so the answer is about the thing in front of you.
    how: "Select + beside the composer. A file is yours alone: no teammate reads it, and it never appears under Reports. The file goes to the model provider this deployment uses. On a keyless deployment, a text file is still read in full."
    link: /chat
    since: 2026-08-16
