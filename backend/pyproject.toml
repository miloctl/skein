[project]
name = "skein"
version = "0.2.1"
description = "Skein — team coordination platform for humans + AI agents, built on the Strands Agents SDK"
# LICENSE/NOTICE are copies of the repo-root originals: PEP 639 forbids
# parent-directory paths in license-files, and setuptools silently drops
# them from the built wheel. lint.sh asserts the copies match.
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.12"
dependencies = [
    "strands-agents[anthropic,openai,ollama]>=1.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "apscheduler>=3.10",
    "pyyaml>=6.0",
    "strands-agents-tools>=0.2",
    "pyjwt[crypto]>=2.8",
    # SKEIN_TZ resolves through zoneinfo, which reads /usr/share/zoneinfo and
    # NOTHING else. The slim/alpine/distroless images this ships on carry no
    # system tzdata, so without this every zone lookup fails and the whole
    # deployment silently runs in UTC.
    "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-xdist>=3",
    # starlette 1.x TestClient imports this. No test file names it, so a
    # dependency cleanup reads it as unused.
    "httpx2>=2.9",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-PyYAML",
    "vulture>=2.13",
    # tests/test_model_registry.py validates fixtures against
    # schemas/skein_models.schema.json — runtime validation stays hand-rolled
    # in config.py, and this test is what keeps the two from drifting.
    "jsonschema>=4.21",
]

[tool.setuptools]
packages = { find = { include = ["app*"] } }

[tool.setuptools.package-data]
"app" = ["py.typed"]
"app.core_migrations" = ["*.sql"]

[tool.setuptools.data-files]
"skein_stock/fieldguide" = ["fieldguide/*.yaml"]
"skein_stock/playbooks" = ["playbooks/*.yaml"]
"skein_stock/personas" = ["personas/*.md", "personas/*.json"]
"skein_stock/flocks" = ["flocks/*.yaml"]
"skein_stock/schemas" = ["schemas/*.json"]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
addopts = "-n auto"

[tool.vulture]
paths = ["app", "seed.py", "../cli/skein_cli.py"]
# decorator-registered entry points look unused to static analysis
ignore_decorators = ["@app.*", "@router.*", "@mcp.*", "@tool", "@pytest.fixture"]
ignore_names = [
    "row_factory", "isolation_level",  # sqlite3 connection config, write-only
    "repository",  # CIEventIn schema field, read via model_dump() in services/ci.py
    "model_config",  # pydantic v2 model settings, read by the metaclass
    # request.state fields the perimeter middleware sets and routes/deps.py
    # reads back through getattr, which static analysis cannot follow
    "auth_key_owner", "auth_claims", "auth_human_owner",
    # the SDK's SessionRepository ABC requires the multi-agent trio; Skein
    # never builds a Swarm or Graph, so nothing here calls them. The import
    # is real but appears only in quoted annotations under TYPE_CHECKING.
    "create_multi_agent", "update_multi_agent", "MultiAgentBase",
    # read only by test_admin_export.py's completeness sweep, which vulture
    # does not scan
    "EXCLUDED",
    # the consult budget's teardown, called only by tests/conftest.py's autouse
    # reset — the same place receipts.reset() is called from, which escapes
    # this list only because the bare name `reset` is used inside app/ too
    "reset_consults",
    # the strands SDK calls register_hooks on every session manager it is
    # handed (Agent.__init__); the kwargs are its signature, not ours
    "register_hooks",
    # anyio's CapacityLimiter setter, assigned once in main.py's lifespan
    "total_tokens",
    # Public extension-contract fields read by workplace policy rules and by
    # Pydantic serialization. Core does not need to branch on each field.
    "tool_risk", "error_code", "policy_effect", "created_by", "updated_at", "checkpoint",
    "review_id", "delivery_id", "command_context",
    # AgentTool protocol properties called by the Strands registry.
    "tool_type", "supports_hot_reload",
    # Public work commands. A private package calls these; core only resumes
    # them after review, so every entry point is outside the scanned paths.
    "create_blocker", "update_blocker", "get_blocker",
    "create_promise", "update_promise", "get_promise",
]
min_confidence = 60
sort_by_size = true

[tool.mypy]
python_version = "3.12"
files = ["app", "seed.py"]
ignore_missing_imports = true
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
