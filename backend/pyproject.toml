[project]
name = "skein"
version = "0.1.0"
description = "Skein — team coordination platform for humans + AI agents, built on the Strands Agents SDK"
license = "Apache-2.0"
license-files = ["../LICENSE", "../NOTICE"]
requires-python = ">=3.10"
dependencies = [
    "strands-agents[anthropic,openai,ollama]>=1.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "apscheduler>=3.10",
    "pyyaml>=6.0",
    "strands-agents-tools>=0.2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.8", "mypy>=1.13", "types-PyYAML", "vulture>=2.13"]

[tool.setuptools]
packages = { find = { include = ["app*"] } }

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.vulture]
paths = ["app", "seed.py", "../cli/skein_cli.py"]
# decorator-registered entry points look unused to static analysis
ignore_decorators = ["@app.*", "@router.*", "@mcp.*", "@tool", "@pytest.fixture"]
ignore_names = [
    "row_factory", "isolation_level",  # sqlite3 connection config, write-only
    "repository",  # CIEventIn schema field, read via model_dump() in services/ci.py
    "model_config",  # pydantic v2 model settings, read by the metaclass
]
min_confidence = 60
sort_by_size = true

[tool.mypy]
python_version = "3.10"
files = ["app", "seed.py"]
ignore_missing_imports = true
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
