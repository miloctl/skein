[project]
name = "skein-agents"
version = "0.3.2"
description = "Skein — team coordination platform for humans + AI agents, built on the Strands Agents SDK"
# LICENSE/NOTICE are copies of the repo-root originals: PEP 639 forbids
# parent-directory paths in license-files, and setuptools silently drops
# them from the built wheel. lint.sh asserts the copies match.
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.12"
dependencies = [
    "strands-agents[anthropic,openai,ollama]>=1.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "apscheduler>=3.10",
    "pyyaml>=6.0",
    "strands-agents-tools>=0.2",
    "pyjwt[crypto]>=2.8",
    # FastAPI parses a multipart body (the file upload route) only when this is
    # installed — without it the route raises at import time, not at request
    # time. Both arrive transitively today; naming them keeps a dependency
    # cleanup in either upstream from taking the upload path with it.
    "python-multipart>=0.0.9",
    # services/uploads.py verifies image bytes with it, and leans on its
    # decompression-bomb guard.
    "pillow>=10.0",
    # [binary] ships libpq in the wheel. Without it psycopg needs libpq-dev and
    # a compiler at install time, and the slim image has neither — the build
    # fails at pip install, not at runtime.
    "psycopg[binary,pool]>=3.2",
    # SKEIN_TZ resolves through zoneinfo, which reads /usr/share/zoneinfo and
    # NOTHING else. The slim/alpine/distroless images this ships on carry no
    # system tzdata, so without this every zone lookup fails and the whole
    # deployment silently runs in UTC.
    "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-xdist>=3",
    # starlette 1.x TestClient imports this. No test file names it, so a
    # dependency cleanup reads it as unused.
    "httpx2>=2.9",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-PyYAML",
    "vulture>=2.13",
    # tests/test_model_registry.py validates fixtures against
    # schemas/skein_models.schema.json — runtime validation stays hand-rolled
    # in config.py, and this test is what keeps the two from drifting.
    "jsonschema>=4.21",
    # CI gates on --cov-fail-under (ci.yml). Not in addopts: coverage adds
    # ~45% to a local run, so the plain `pytest` stays fast and CI holds
    # the line.
    "pytest-cov>=6",
    "hypothesis>=6.100",
    # scripts/audit-deps.sh; scripts/mutation-test.sh
    "pip-audit>=2.7",
    "mutmut>=3",
]

[tool.setuptools]
packages = { find = { include = ["app*"] } }

[tool.setuptools.package-data]
"app" = ["py.typed"]
"app.core_migrations" = ["*.sql"]

[tool.setuptools.data-files]
"skein_stock/fieldguide" = ["fieldguide/*.yaml"]
"skein_stock/playbooks" = ["playbooks/*.yaml"]
"skein_stock/personas" = ["personas/*.md", "personas/*.json"]
"skein_stock/flocks" = ["flocks/*.yaml"]
"skein_stock/schemas" = ["schemas/*.json"]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.mutmut]
# Run through scripts/mutation-test.sh, on demand — never a CI gate: a full
# sweep of app/services/ takes hours. The services are the write path, so
# they are the code whose tests must have teeth.
source_paths = ["app/services/"]
pytest_add_cli_args_test_selection = ["tests/"]
# Two classes of test cannot run from mutants/, and both are baseline
# failures there, not weak tests. (1) Tests that resolve repo files by
# walking parents of their own path (../cli, examples/, deploy/, the
# release contract) land outside the tree mutmut copies. (2) The
# visibility sweeps read services SOURCE TEXT, and mutant-rewritten source
# is not the text they parse. Every test here still runs in the real suite.
pytest_add_cli_args = [
    # -n0 overrides the -n auto in addopts: mutmut maps which test covers
    # which mutant by tracing IN PROCESS, and xdist moves the tests into
    # workers where the trace sees nothing — every mutant then reports "no
    # test case". mutmut parallelizes across mutants itself (max-children).
    "-n0",
    "--ignore=tests/test_reference_workplace_extension.py",
    "--ignore=tests/test_cli.py",
    "--ignore=tests/test_release_contract.py",
    "--deselect=tests/test_packaging.py::test_dockerfile_copies_every_content_dir",
    "--deselect=tests/test_database_fixtures.py::test_postgres_commands_allow_a_clean_twenty_minute_shutdown",
    "--deselect=tests/test_import_boundary.py::test_the_reference_extension_holds_the_boundary",
    "--deselect=tests/test_visibility_authz.py::test_every_id_addressed_mutation_is_listed",
    "--deselect=tests/test_visibility_authz.py::test_every_read_of_a_scoped_table_is_filtered_or_excused",
    "--deselect=tests/test_activity_feed.py::test_the_verb_registry_and_the_logged_actions_agree",
]
# The packaged content the app reads at import time, resolved relative to
# the source tree — absent from mutants/, every run dies on startup. app/
# here is safe: mutant generation writes AFTER this copy, so the mutated
# services files win over the plain ones.
also_copy = [
    "app/",
    "personas/",
    "flocks/",
    "playbooks/",
    "fieldguide/",
    "schemas/",
    "seed.py",
]

[tool.pytest.ini_options]
addopts = "-n auto"
# a bare `pytest` otherwise also collects mutants/tests/ whenever the
# mutation cache exists, and the copies fail on their moved paths
testpaths = ["tests"]

[tool.vulture]
paths = ["app", "seed.py", "../cli/skein_cli.py"]
# decorator-registered entry points look unused to static analysis
ignore_decorators = ["@app.*", "@router.*", "@mcp.*", "@tool", "@pytest.fixture"]
ignore_names = [
    "row_factory", "isolation_level",  # sqlite3 connection config, write-only
    "repository",  # CIEventIn schema field, read via model_dump() in services/ci.py
    "model_config",  # pydantic v2 model settings, read by the metaclass
    # request.state fields the perimeter middleware sets and routes/deps.py
    # reads back through getattr, which static analysis cannot follow
    "auth_key_owner", "auth_claims", "auth_human_owner",
    # the SDK's SessionRepository ABC requires the multi-agent trio; Skein
    # never builds a Swarm or Graph, so nothing here calls them. The import
    # is real but appears only in quoted annotations under TYPE_CHECKING.
    "create_multi_agent", "update_multi_agent", "MultiAgentBase",
    # read only by test_admin_export.py's completeness sweep, which vulture
    # does not scan
    "EXCLUDED",
    # read only by test_retention.py's every-table sweep, same as EXCLUDED
    "KEPT", "CASCADED", "PRIVATE_KEPT",
    # read only by the restore drill and digest test in test_admin_backup.py:
    # the pre-restore comparison an operator performs
    "recorded_backup_digests",
    # the consult budget's teardown, called only by tests/conftest.py's autouse
    # reset — the same place receipts.reset() is called from, which escapes
    # this list only because the bare name `reset` is used inside app/ too
    "reset_consults",
    # PyJWT calls the safe redirect and cache override through its base class
    "fetch_data",
    # the strands SDK calls register_hooks on every session manager it is
    # handed (Agent.__init__); the kwargs are its signature, not ours
    "register_hooks",
    # anyio's CapacityLimiter setter, assigned once in main.py's lifespan
    "total_tokens",
    # Public extension-contract fields read by workplace policy rules and by
    # Pydantic serialization. Core does not need to branch on each field.
    "tool_risk", "error_code", "policy_effect", "created_by", "updated_at", "checkpoint",
    "review_id", "delivery_id", "command_context",
    # PyYAML calls this loader override through its composer protocol.
    "construct_mapping",
    # This source classification is part of the structured-setting contract.
    # Tests consume it because MCP details must not reach a public response.
    "MCP_SERVERS_SOURCE",
    # AgentTool protocol properties called by the Strands registry.
    "tool_type", "supports_hot_reload",
    # Public work commands. A private package calls these; core only resumes
    # them after review, so every entry point is outside the scanned paths.
    "create_blocker", "update_blocker", "get_blocker",
    "create_promise", "update_promise", "get_promise",
]
min_confidence = 60
sort_by_size = true

[tool.mypy]
python_version = "3.12"
files = ["app", "seed.py"]
ignore_missing_imports = true
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
